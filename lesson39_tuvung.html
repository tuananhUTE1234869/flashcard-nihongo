<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG32</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            let lesson3 = [

                { voca: "こたえます", tv: "trả lời" },

                { voca: "しつもんにこたえます", tv: "trả lời câu hỏi" },

                { voca: "たおれます", tv: "ngã, đổ" },

                { voca: "ビルがたおれます", tv: "tòa nhà bị đổ" },

                { voca: "とおります", tv: "đi qua, thông qua" },

                { voca: "みちをとおります", tv: "đi qua con đường" },

                { voca: "しにます", tv: "chết" },

                { voca: "びっくりします", tv: "ngạc nhiên, giật mình" },

                { voca: "がっかりします", tv: "thất vọng" },

                { voca: "あんしんします", tv: "an tâm" },

                { voca: "けんかします", tv: "cãi nhau" },

                { voca: "りこんします", tv: "ly hôn" },

                { voca: "ふとります", tv: "béo ra" },

                { voca: "やせます", tv: "gầy đi" },

                { voca: "ふくざつな", tv: "phức tạp" },

                { voca: "じゃまな", tv: "cản trở, phiền phức, vướng víu" },

                { voca: "かたい", tv: "cứng" },

                { voca: "やわらかい", tv: "mềm" },

                { voca: "きたない", tv: "bẩn, dơ" },

                { voca: "うれしい", tv: "vui, mừng rỡ" },

                { voca: "かなしい", tv: "đau buồn" },

                { voca: "はずかしい", tv: "ngại ngùng, xấu hổ" },

                { voca: "しゅしょう", tv: "thủ tướng" },

                { voca: "じしん", tv: "động đất" },

                { voca: "つなみ", tv: "sóng thần" },

                { voca: "たいふう", tv: "bão" },

                { voca: "かみなり", tv: "sấm" },

                { voca: "かじ", tv: "hỏa hoạn" },

                { voca: "じこ", tv: "sự cố, tai nạn" },

                { voca: "ハイキング", tv: "hiking, đi bộ ngắm núi đồi" },

                { voca: "おみあい", tv: "trai gái gặp mặt, mai mối" },

                { voca: "そうさ", tv: "thao tác, điều khiển" },

                { voca: "かいじょう", tv: "hội trường" },

                { voca: "～だい", tv: "phí ~, tiền ~" },

                { voca: "～や", tv: "tiệm ~" },

                { voca: "フロント", tv: "quầy lễ tân" },

                { voca: "～ごうしつ", tv: "phòng số ~" },

                { voca: "タオル", tv: "khăn mặt, khăn lông" },

                { voca: "せっけん", tv: "xà phòng" },

                { voca: "おおぜい", tv: "nhiều người" },

                { voca: "おつかれさまでした", tv: "anh/chị đã vất vả rồi" },

                { voca: "うかがう", tv: "đi, đến (khiêm nhường của 行く)" },

                { voca: "とちゅうで", tv: "trên đường, dọc đường, giữa chừng" },

                { voca: "トラック", tv: "xe tải" },

                { voca: "ぶつかる", tv: "đụng nhau, va chạm" },

                { voca: "おとな", tv: "người lớn" },

                { voca: "しかし", tv: "tuy nhiên" },

                { voca: "また", tv: "hơn nữa, và" },

                { voca: "ようふく", tv: "âu phục, đồ tây" },

                { voca: "せいようかします", tv: "Tây Âu hóa" },

                { voca: "あいます", tv: "phù hợp, vừa vặn" },

                { voca: "いまでは", tv: "thời nay" },

                { voca: "せいじんしき", tv: "lễ thành nhân (20 tuổi)" },

                { voca: "でんとうてきな", tv: "tính truyền thống" },

            ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
