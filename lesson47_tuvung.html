lesson41_tuvung.html<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG47</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [

                { voca: "ふきます", tv: "thổi" },

                { voca: "かぜがふきます", tv: "gió thổi" },

                { voca: "もえます", tv: "cháy" },

                { voca: "ごみがもえます", tv: "rác cháy" },

                { voca: "なくなります", tv: "mất, qua đời, chết" },

                { voca: "あつまります", tv: "tập trung lại" },

                { voca: "ひとがあつまります", tv: "mọi người tập trung lại" },

                { voca: "データをあつめます", tv: "thu thập dữ liệu" },

                { voca: "わかれます", tv: "chia tay" },

                { voca: "かぞくとわかれます", tv: "chia tay gia đình" },

                { voca: "します", tv: "nghe thấy, nghe mùi, có vị, cảm thấy" },

                { voca: "へんなおとがします", tv: "nghe thấy tiếng động lạ" },

                { voca: "なきごえがします", tv: "nghe thấy tiếng khóc" },

                { voca: "にがいあじがします", tv: "cảm thấy có vị đắng" },

                { voca: "いいにおいがします", tv: "ngửi thấy mùi thơm" },

                { voca: "きびしい", tv: "nghiêm khắc" },

                { voca: "ひどい", tv: "khủng khiếp, (mưa) lớn, (ứng xử) tệ" },

                { voca: "こわい", tv: "sợ hãi, đáng sợ" },

                { voca: "じっけん", tv: "thực nghiệm, thí nghiệm" },

                { voca: "データ", tv: "dữ liệu" },

                { voca: "じんこう", tv: "dân số" },

                { voca: "におい", tv: "mùi" },

                { voca: "かがく", tv: "khoa học" },

                { voca: "かがく", tv: "hóa học" },

                { voca: "いがく", tv: "y học" },

                { voca: "ぶんがく", tv: "văn học" },

                { voca: "パトカー", tv: "xe cảnh sát" },

                { voca: "きゅうきゅうしゃ", tv: "xe cấp cứu" },

                { voca: "さんせい", tv: "tán thành" },

                { voca: "はんたい", tv: "phản đối" },

                { voca: "だいとうりょう", tv: "tổng thống" },

                { voca: "〜によると", tv: "dựa theo ~, theo như ~" },

                { voca: "こんやくします", tv: "đính hôn" },

                { voca: "どうも", tv: "có vẻ như là..." },

                { voca: "こいびと", tv: "người yêu" },

                { voca: "あいて", tv: "đối phương, đối tác" },

                { voca: "しりあいます", tv: "quen biết" },

                { voca: "けしょう", tv: "việc trang điểm" },

                { voca: "けしょうひん", tv: "mỹ phẩm" },

                { voca: "けしょうをします", tv: "trang điểm" },

                { voca: "せわをします", tv: "chăm sóc" },

                { voca: "じょせい", tv: "phụ nữ, nữ giới" },

                { voca: "だんせい", tv: "nam giới" },

                { voca: "だんじょ", tv: "nam nữ" },

                { voca: "ながいきします", tv: "sống thọ" },

                { voca: "りゆう", tv: "lý do" },

                { voca: "かんけい", tv: "quan hệ" },

            ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
