<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>KANJI48</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>1
        
        <script>
            // tạo thẻ 
            

                let lesson3 = [

                    { voca: "利用する", tv: "りようする lợi dụng" },

                    { voca: "勤める", tv: "つと(める) cần" },

                    { voca: "会社に勤める", tv: "かいしゃにつと(める) hội xã cần" },

                    { voca: "掛ける", tv: "か(ける) quải" },

                    { voca: "椅子に掛ける", tv: "いすにか(ける) ỷ tử quải" },

                    { voca: "過ごす", tv: "す(ごす) quá" },

                    { voca: "召し上がる", tv: "めしあ(がる) triệu thượng" },

                    { voca: "仰る", tv: "おっしゃる ngưỡng" },

                    { voca: "為さる", tv: "なさる vi" },

                    { voca: "ご覧になる", tv: "ごらんになる lãm" },

                    { voca: "ご存知です", tv: "ごぞんじです tồn tri" },

                    { voca: "挨拶", tv: "あいさつ ai-át" },

                    { voca: "挨拶をする", tv: "あいさつをする ai-át" },

                    { voca: "旅館", tv: "りょかん lữ quán" },

                    { voca: "停", tv: "てい đình" },

                    { voca: "奥様", tv: "おくさま áo dạng" },

                    { voca: "様", tv: "さま dạng" },

                    { voca: "言います", tv: "い(います) ngôn" },

                    { voca: "年組", tv: "ねんぐみ niên tổ" },

                    { voca: "出す", tv: "だ(す) xuất" },

                    { voca: "熱を出す", tv: "ねつをだ(す) nhiệt xuất" },

                    { voca: "伝える", tv: "つた(える) truyền" },

                    { voca: "失礼いたします", tv: "しつれいいたします thất lễ" },

                    { voca: "小学校", tv: "しょうがっこう tiểu học hiệu" },

                    { voca: "経歴", tv: "けいれき kinh lịch" },

                    { voca: "医学部", tv: "いがくぶ y học bộ" },

                    { voca: "目指す", tv: "めざ(す) mục chỉ" },

                    { voca: "進む", tv: "すす(む) tiến" },

                    { voca: "細胞", tv: "さいぼう tế bào" },

                    { voca: "開発する", tv: "かいはつする khai phát" },

                    { voca: "受賞する", tv: "じゅしょうする thụ thưởng" },

                    { voca: "講演会", tv: "こうえんかい giảng diễn hội" },

                    { voca: "山中伸弥", tv: "やまなかしんや sơn trung thân di" },

                    { voca: "賞", tv: "しょう thưởng" },

                ];
                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
