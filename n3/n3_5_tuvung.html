<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 ことば -250</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                { voca: "むく", tv: "bóc, lột" },
                { voca: "すべる", tv: "trượt, trượt băng" },
                { voca: "つもる", tv: "tích trữ, chồng chất lên" },
                { voca: "つむ", tv: "chất lên" },
                { voca: "あく", tv: "bỏ trống, có sẵn, mở" },
                { voca: "あける", tv: "đục (lỗ), bỏ trống" },
                { voca: "さがる", tv: "đi xuống, lùi lại" },
                { voca: "さげる", tv: "làm giảm xuống, lấy đi" },
                { voca: "ひえる", tv: "được ướp lạnh, cảm thấy lạnh" },
                { voca: "ひやす", tv: "làm lạnh, bình tĩnh" },
                { voca: "さめる", tv: "bị lạnh (nguội), mất đam mê" },
                { voca: "さます", tv: "làm cho cái gì đó lạnh" },
                { voca: "もえる", tv: "cháy, đam mê" },
                { voca: "もやす", tv: "đốt cháy, cháy cùng (đam mê)" },
                { voca: "わく", tv: "sôi, (bồn tắm) sẵn sàng, trở nên sôi động" },
                { voca: "わかす", tv: "đun sôi, chuẩn bị (tắm), sôi động" },
                { voca: "なる", tv: "kêu lên (đùng đùng), kêu" },
                { voca: "ならす", tv: "làm kêu, bấm còi" },
                { voca: "やくだつ / やくにたつ", tv: "hữu ích" },
                { voca: "やくだてる / やくにたてる", tv: "đưa vào sử dụng, ứng dụng" },
                { voca: "かざり", tv: "trang trí" },
                { voca: "あそび", tv: "trò chơi, chơi" },
                { voca: "あつまり", tv: "tập trung" },
                { voca: "おしえ", tv: "chỉ dạy" },
                { voca: "おどり", tv: "nhảy múa" },
                { voca: "おもい", tv: "suy nghĩ, cảm nhận" },
                { voca: "かんがえ", tv: "suy nghĩ, ý tưởng" },
                { voca: "かたづけ", tv: "dọn dẹp" },
                { voca: "てつだい", tv: "giúp đỡ" },
                { voca: "はたらき", tv: "chức năng, hoạt động" },
                { voca: "きまり", tv: "quy định, luật" },
                { voca: "さわぎ", tv: "ồn ào, phiền phức" },
                { voca: "しらせ", tv: "thông báo, thông tin" },
                { voca: "たのみ", tv: "nhờ, yêu cầu" },
                { voca: "つかれ", tv: "mệt mỏi" },
                { voca: "ちがい", tv: "khác nhau" },
                { voca: "はじめ", tv: "bắt đầu, phần đầu" },
                { voca: "つづき", tv: "tiếp tục, đoạn tiếp theo" },
                { voca: "くれ", tv: "cuối (năm)" },
                { voca: "いき", tv: "đi, lúc đi" },
                { voca: "かえり", tv: "trở về, lúc về" },
                { voca: "いそぎ", tv: "khẩn cấp" },
                { voca: "おくれ", tv: "chậm trễ, muộn" },
                { voca: "かし", tv: "cho vay" },
                { voca: "かり", tv: "vay" },
                { voca: "かち", tv: "thắng" },
                { voca: "まけ", tv: "thua" },
                { voca: "むかえ", tv: "đón" },
                { voca: "はじまり", tv: "sự bắt đầu" },
                { voca: "おわり", tv: "sự kết thúc" }
                ];

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
