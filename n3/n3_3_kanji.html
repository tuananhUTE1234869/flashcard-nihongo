<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 かんじ3</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                { voca: "判", tv: "はん phán" },
                { voca: "名刺", tv: "めいし danh thích" },
                { voca: "免許", tv: "めんきょ miễn hứa" },
                { voca: "多く", tv: "おおく đa" },
                { voca: "前半", tv: "ぜんはん tiền bán" },
                { voca: "後半", tv: "こうはん hậu bán" },
                { voca: "最高", tv: "さいこう tối cao" },
                { voca: "最低", tv: "さいてい tối đê" },
                { voca: "最初", tv: "さいしょ tối sơ" },
                { voca: "最後", tv: "さいご tối hậu" },
                { voca: "自動", tv: "じどう tự động" },
                { voca: "種類", tv: "しゅるい chủng loại" },
                { voca: "性格", tv: "せいかく tính cách" },
                { voca: "性質", tv: "せいしつ tính chất" },
                { voca: "順番", tv: "じゅんばん thuận phiên" },
                { voca: "番", tv: "ばん phiên" },
                { voca: "方法", tv: "ほうほう phương pháp" },
                { voca: "製品", tv: "せいひん chế phẩm" },
                { voca: "値上がり", tv: "ねあがり giá thượng" },
                { voca: "生", tv: "なま sinh" },
                { voca: "渇く", tv: "かわく khát" },
                { voca: "嗅ぐ", tv: "かぐ khứu" },
                { voca: "叩く", tv: "たたく khấu" },
                { voca: "殴る", tv: "なぐる ẩu" },
                { voca: "蹴る", tv: "ける đá" },
                { voca: "抱く", tv: "だく bão" },
                { voca: "倒れる", tv: "たおれる đảo" },
                { voca: "倒す", tv: "たおす đảo" },
                { voca: "起きる/起こる", tv: "おきる/おこる khởi" },
                { voca: "起こす", tv: "おこす khởi" },
                { voca: "尋ねる", tv: "たずねる tầm" },
                { voca: "呼ぶ", tv: "よぶ hô" },
                { voca: "叫ぶ", tv: "さけぶ khiếu" },
                { voca: "黙る", tv: "だまる mặc" },
                { voca: "飼う", tv: "かう tự" },
                { voca: "数える", tv: "かぞえる số" },
                { voca: "乾く", tv: "かわく can" },
                { voca: "乾かす", tv: "かわかす can" },
                { voca: "畳む", tv: "たたむ điệp" },
                { voca: "誘う", tv: "さそう dụ" },
                { voca: "奢る", tv: "おごる xa" },
                { voca: "預かる", tv: "あずかる dự" },
                { voca: "預ける", tv: "あずける dự" },
                { voca: "決まる", tv: "きまる quyết" },
                { voca: "決める", tv: "きめる quyết" },
                { voca: "写る", tv: "うつる tả" },
                { voca: "写す", tv: "うつす tả" },
                { voca: "思い出す", tv: "おもいだす tư xuất" },
                { voca: "教わる", tv: "おそわる giáo" },
                { voca: "申し込む", tv: "もうしこむ thân nhập" }
            ];


            
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
