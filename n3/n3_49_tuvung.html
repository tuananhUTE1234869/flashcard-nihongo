<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N4 ことば</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                
                { voca: "まったく", tv: "hoàn toàn "},
                { voca: "くび", tv: "cổ / sự sa thải, đuổi việc" },
                { voca: "ゆび", tv: "ngón tay, ngón chân" },
                { voca: "こし", tv: "eo, hông, thắt lưng" },
                { voca: "かた", tv: "vai" },
                { voca: "もどります", tv: "trở về, quay lại" },
                { voca: "まわります", tv: "xoay, quay" },
                { voca: "くさります", tv: "Thối / Ôi thiu" },
                { voca: "くらべます", tv: "So sánh" },
                { voca: "しばらく", tv: "một chốc, một lát, một thời gian" },
                { voca: "できるだけ", tv: "trong khả năng có thể, hết sức có thể" },
                { voca: "テキスト", tv: "sách giáo khoa" },
                { voca: "ねぼう", tv: "ngủ quên, ngủ dậy muộn" },
                { voca: "よしゅう", tv: "chuẩn bị bài trước" },
                { voca: "かど", tv: "góc, góc đường" },
                { voca: "まがります", tv: "rẽ, quẹo" },
                { voca: "せっけん", tv: "xà phòng, xà bông" },
                { voca: "けしき", tv: "phong cảnh, cảnh sắc" },
                { voca: "そろそろ", tv: "sắp sửa, chuẩn bị (đến lúc)" },
                { voca: "まんいん", tv: "đầy người, đông nghẹt người" },
                { voca: "はっきり", tv: "rõ ràng" },
                { voca: "すきます", tv: "vắng, thưa thớt, trống" },
                { voca: "かず", tv: "số, số lượng" },
                { voca: "ねよう", tv: "sẽ ngủ, định ngủ (thể ý định của ねます)" },
                { voca: "えらい", tv: "vĩ đại, giỏi giang, đáng kính" },
                { voca: "ぺらぺら", tv: "lưu loát, trôi chảy (ngoại ngữ)" },
                { voca: "あら、そうなの？", tv: "Ôi, thế sao? / Thật thế à? (thường do phụ nữ dùng)" },
                { voca: "～みたいだから", tv: "hình như, có vẽ" },
                { voca: "カーテン", tv: "rèm cửa" },
                { voca: "おてあらい", tv: "nhà vệ sinh" },
                { voca: "こっち", tv: "Phía này" },
                { voca: "そっち", tv: "phía đó" },
                { voca: "あっち", tv: "phía kia" },
                { voca: "よろこびます", tv: "vui mừng" },   
                { voca: "とおります", tv: "đi qua, băng qua, thông qua" },



            ];

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
