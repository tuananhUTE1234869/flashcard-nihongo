<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 ことば -450</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ  
            
            const lesson3 = [
                { voca: "にせ", tv: "Giả" },
                { voca: "べつ", tv: "Khác nhau, riêng biệt" },
                { voca: "こくせき", tv: "Quốc tịch" },
                { voca: "とうよう", tv: "Phương Đông" },
                { voca: "せいよう", tv: "Phương Tây, thuộc về phương tây" },
                { voca: "こくさい", tv: "Quốc tế" },
                { voca: "しぜん", tv: "Tự nhiên" },
                { voca: "けしき", tv: "Phong cảnh, cảnh sắc" },
                { voca: "しゅうきょう", tv: "Tôn giáo" },
                { voca: "あい", tv: "Tình yêu" },
                { voca: "とどく", tv: "Được giao, chạm tới" },
                { voca: "とどける", tv: "Giao đến, thông báo" },
                { voca: "かく", tv: "Đổ, toát mồ hôi, gãi, xấu hổ, mất mặt" },
                { voca: "つかむ", tv: "Nắm, bắt, túm, tóm được" },
                { voca: "にぎる", tv: "Túm lấy, nắm lấy" },

                { voca: "おさえる", tv: "Nắm bắt, giữ" },
                { voca: "ちかづく", tv: "Lại gần" },
                { voca: "ちかづける", tv: "Mang, đưa đến gần" },
                { voca: "あう", tv: "Gặp, hợp, đúng" },
                { voca: "あわせる", tv: "Hợp, chỉnh (đồng hồ)" },
                { voca: "あたる", tv: "Bị đánh, trúng, đối đầu" },
                { voca: "あてる", tv: "Đánh, đúng, chạm" },
                { voca: "くらべる", tv: "So sánh" },
                { voca: "にあう", tv: "Hợp, vừa" },
                { voca: "にる", tv: "Giống" },
                { voca: "にせる", tv: "Bắt chước, mô phỏng" },
                { voca: "わかれる", tv: "Chia" },
                { voca: "わける", tv: "Bỏ rơi, chia, tách" },
                { voca: "たす", tv: "Cộng, thêm" },
                { voca: "ひく", tv: "Trừ, bớt, kéo, dẫn" },
                { voca: "ふえる", tv: "Tăng lên, gia tăng" },
                { voca: "ふやす", tv: "Làm tăng thêm" },
                { voca: "へる", tv: "Giảm" },
                { voca: "へらす", tv: "Cắt giảm" },
                { voca: "かわる", tv: "Thay đổi, biến đổi" },

                { voca: "かえる", tv: "Đổi" },
                { voca: "かわる", tv: "Thay đổi, thay thế" },
                { voca: "かえる", tv: "Thay đổi, thế chỗ cái gì đó" },
                { voca: "かえる", tv: "Được trả lại" },
                { voca: "かえす", tv: "Trả lại" },
                { voca: "ゆずる", tv: "Bàn giao, chuyển nhượng" },
                { voca: "たすかる", tv: "Được cứu giúp (sống sót), có lợi, có ích" },
                { voca: "たすける", tv: "Cứu, giúp" },
                { voca: "いじめる", tv: "Bắt nạt, ăn hiếp, chọc ghẹo" },
                { voca: "だます", tv: "Lừa bịp" },
                { voca: "ぬすむ", tv: "Ăn cắp, trộm" },
                { voca: "ささる", tv: "Mắc, hóc, đâm" },
                { voca: "さす", tv: "Cắn, hút, chích, châm, thọc" },
                { voca: "ころす", tv: "Giết, sát hại" },
                { voca: "かくれる", tv: "Trốn, nấp, núp" }
            ];
                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
