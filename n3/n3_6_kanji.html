<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 かんじ -300</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                { voca: "戻り", tv: "もどり lệ" },
                { voca: "別れ", tv: "わかれ biệt" },
                { voca: "喜び", tv: "よろこび hỷ" },
                { voca: "楽しみ", tv: "たのしみ lạc" },
                { voca: "笑い", tv: "わらい tiếu" },
                { voca: "驚き", tv: "おどろき kinh" },
                { voca: "怒り", tv: "いかり nộ" },
                { voca: "悲しみ", tv: "かなしみ bi" },
                { voca: "幸せな", tv: "しあわせな hạnh" },
                { voca: "得意な", tv: "とくいな đắc ý" },
                { voca: "苦手な", tv: "にがてな khổ thủ" },
                { voca: "熱心な", tv: "ねっしんな nhiệt tâm" },
                { voca: "夢中な", tv: "むちゅうな mộng trung" },
                { voca: "退屈な", tv: "たいくつな thoái quật" },
                { voca: "健康な", tv: "けんこうな kiện khang" },
                { voca: "苦しい", tv: "くるしい khổ" },
                { voca: "平気な", tv: "へいきな bình khí" },
                { voca: "悔しい", tv: "くやしい hối" },
                { voca: "我慢強い", tv: "がまんづよい ngã mạn cường" },
                { voca: "正直な", tv: "しょうじきな chính trực" },
                { voca: "積極的な", tv: "せっきょくてきな tích cực đích" },
                { voca: "消極的な", tv: "しょうきょくてきな tiêu cực đích" },
                { voca: "満足な", tv: "まんぞくな mãn túc" },
                { voca: "不満な", tv: "ふまんな bất mãn" },
                { voca: "不安な", tv: "ふあんな bất an" },
                { voca: "大変な", tv: "たいへんな đại biến" },
                { voca: "無理な", tv: "むりな vô lý" },
                { voca: "不注意な", tv: "ふちゅういな bất chú ý" },
                { voca: "楽な", tv: "らくな lạc" },
                { voca: "面倒な", tv: "めんどうな diện đảo" },
                { voca: "失礼な", tv: "しつれいな thất lễ" },
                { voca: "当然な", tv: "とうぜんな đương nhiên" },
                { voca: "意外な", tv: "いがいな ý ngoại" },
                { voca: "結構な", tv: "けっこうな kết cấu" },
                { voca: "派手な", tv: "はでな phái thủ" },
                { voca: "地味な", tv: "じみな địa vị" },
                { voca: "変な", tv: "へんな biến" },
                { voca: "不思議な", tv: "ふしぎな bất tư nghị" },
                { voca: "自由な", tv: "じゆうな tự do" },
                { voca: "不自由な", tv: "ふじゆうな bất tự do" },
                { voca: "暖まる / 温まる", tv: "あたたまる noãn/ôn" },
                { voca: "暖める / 温める", tv: "あたためる noãn/ôn" }
            ];

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
