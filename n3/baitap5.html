<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="baitap.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>Bài Tập 7-8</h1></div>

        <div class="frame-box">
            <div class="box" id="box">
            
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>


        <script>

            const lesson3 = [
                // 7課 (Câu 1 - 8)
                { cauhoi: "（  ）、「ズボン」はフランス語から来た言葉だということです。",
                    a: "先生の説明は",
                    b: "先生の説明では",
                    c: "先生の説明からは",
                    d: "",
                dapan_d: "先生の説明では" },

                { cauhoi: "今朝の新聞（  ）、痛み止めの新しい薬が発売されるということだ。",
                    a: "によって",
                    b: "によったら",
                    c: "によると",
                    d: "",
                dapan_d: "によると" },

                { cauhoi: "（  ）、この家は300年ぐらい前に建てられたと言われている。",
                    a: "確かではないが",
                    b: "山川さんの話では",
                    c: "林さんから聞いたのだが",
                    d: "",
                dapan_d: "確かではないが" },

                { cauhoi: "今、テレビの天気予報で見たんだけど、あしたは全国的に雨だ（  ）よ。",
                    a: "と聞いている",
                    b: "と言われている",
                    c: "そうだ",
                    d: "",
                dapan_d: "そうだ" },

                { cauhoi: "足の裏を日に当てると健康に（  ）とか。本当だろうか。",
                    a: "いい",
                    b: "いいです",
                    c: "いいそうだ",
                    d: "",
                dapan_d: "いい" },

                { cauhoi: "A「あしたは（  ）。」B「わあ。いやだなあ。あしたは野球の練習があるんだ。」",
                    a: "暑いと",
                    b: "暑いって",
                    c: "暑くって",
                    d: "",
                dapan_d: "暑いって" },

                { cauhoi: "昔、この地方には、珍しい習慣が（  ）という。",
                    a: "あった",
                    b: "あったそうだ",
                    c: "あったんだって",
                    d: "",
                dapan_d: "あった" },

                { cauhoi: "この地域の土地の値段は今後もあまり高く（  ）という。",
                    a: "なりません",
                    b: "ならないでしょう",
                    c: "ならないだろう",
                    d: "",
                dapan_d: "ならないだろう" },

                // 8課 (Câu 9 - 16)
                { cauhoi: "わたしはこんなに健康に注意しているのだ。（  ）はずがない。",
                    a: "病気になる",
                    b: "病気にならない",
                    c: "病気ではない",
                    d: "",
                dapan_d: "病気になる" },

                { cauhoi: "田中さんにはそのことを先週話したのだから、（  ）。",
                    a: "知るわけがない",
                    b: "知っているわけがない",
                    c: "知らないわけがない",
                    d: "",
                dapan_d: "知らないわけがない" },

                { cauhoi: "強いチームではないが、（  ）とは限らない。",
                    a: "絶対勝てない",
                    b: "必ず勝てる",
                    c: "絶対負けない",
                    d: "",
                dapan_d: "絶対勝てない" },

                { cauhoi: "旅行に（  ）わけではなく、二日目から参加するつもりなのです。",
                    a: "行ける",
                    b: "行かない",
                    c: "行きたい",
                    d: "",
                dapan_d: "行かない" },

                { cauhoi: "わたしたち兄弟は仲がよくないことはないが、（  ）。",
                    a: "いつもいっしょにいる",
                    b: "いっしょにいることもある",
                    c: "いっしょにいることは少ない",
                    d: "",
                dapan_d: "いっしょにいることは少ない" },

                { cauhoi: "山田さんの住所はここに書いてあることは（  ）が、10年前のです。",
                    a: "書きました",
                    b: "書いています",
                    c: "書いてあります",
                    d: "",
                dapan_d: "書いてあります" },

                { cauhoi: "少し寒いことは寒いが、（  ）。",
                    a: "暖房は必要ない",
                    b: "暖房を入れよう",
                    c: "暖房を入れた",
                    d: "",
                dapan_d: "暖房は必要ない" },

                { cauhoi: "わたしはテレビを（  ）が、ニュース番組だけだ。",
                    a: "見ることは見ない",
                    b: "見ないことは見ない",
                    c: "見ることは見る",
                    d: "",
                dapan_d: "見ることは見る" },

                // 7課・8課 (Câu 17 - 26)
                { cauhoi: "ねえ、この記事見て。きのうのスケート大会、青木選手が（  ）。",
                    a: "優勝したとか",
                    b: "優勝したんだって",
                    c: "優勝したという",
                    d: "",
                dapan_d: "優勝したんだって" },

                { cauhoi: "石田さんの奥さんの話では、石田さんはあした退院する（  ）。",
                    a: "とのことです",
                    b: "と言いました",
                    c: "と言われています",
                    d: "",
                dapan_d: "とのことです" },

                { cauhoi: "アンケートの結果から、ほとんどの人がこの商品に満足している（  ）。",
                    a: "と言われている",
                    b: "とのことだ",
                    c: "ことがわかる",
                    d: "",
                dapan_d: "ことがわかる" },

                { cauhoi: "先生「あした、皆さんが乗るバスは駅前を8時に（  ）。場所と時間を間違えないでください。」",
                    a: "出発するとか",
                    b: "出発します",
                    c: "出発すると言われています",
                    d: "",
                dapan_d: "出発します" },

                { cauhoi: "先生の話では、今のわたしの実力でもがんばれば合格できない（  ）。",
                    a: "ということだ",
                    b: "ことはできないという",
                    c: "ことはないそうだ",
                    d: "",
                dapan_d: "ことはないそうだ" },

                { cauhoi: "仕事がたくさんあるが、あしたまでに（  ）。でも、ミスが出ないか心配だ。",
                    a: "できることはできる",
                    b: "できるはずがない",
                    c: "できるとは限らない",
                    d: "",
                dapan_d: "できることはできる" },

                { cauhoi: "わたしはよくこの店でパンを買うが、この店が特に（  ）ない。",
                    a: "好きでないことは",
                    b: "好きなわけでは",
                    c: "好きとのことでは",
                    d: "",
                dapan_d: "好きなわけでは" },

                { cauhoi: "練習すればだれでもピアノが上手に（  ）。",
                    a: "なるわけがない",
                    b: "なるとは限らない",
                    c: "ならないということだ",
                    d: "",
                dapan_d: "なるとは限らない" },

                { cauhoi: "プロでもうまくできないのだから、わたしに（  ）よ。",
                    a: "できるわけがない",
                    b: "できるわけだという",
                    c: "できないとは限らない",
                    d: "",
                dapan_d: "できるわけがない" },

                { cauhoi: "明美さんが今年（  ）ない。10年前、もう中学生だったのだ。",
                    a: "二十歳のはずが",
                    b: "二十歳でないことは",
                    c: "二十歳のわけでは",
                    d: "",
                dapan_d: "二十歳のはずが" }
            ];
           

            let a = lesson3.length;
            console.log(a); // 5
            
            let html = "";

            //ramdom
            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }



            for (let i = 1; i <= a; i++) {

                    // Lấy 4 đáp án và random thứ tự
                let dapan = [
                    lesson3[i-1].a,
                    lesson3[i-1].b,
                    lesson3[i-1].c,
                    lesson3[i-1].d
                ];
                dapan.sort(() => Math.random() - 0.5);


                html += `
                    <div class="box-cauhoi${i} box-cauhoi">
                        <div class="cauhoi">
                            ${lesson3[i-1].cauhoi}
                        </div>
                        <div class="dapan">
                            <div class="dapan-up huong">
                                <div class="a item">
                                    ${dapan[0]}
                                </div>
                                <div class="b item">
                                    ${dapan[1]}
                                </div>
                            </div>
                            <div class="dapan-down huong">
                                <div class="c item">
                                    ${dapan[2]}
                                </div>
                                <div class="d item">
                                    ${dapan[3]}
                                </div>
                            </div>
                        </div>
                        <div class="dapan-d">
                            <div class="action${i} action"></div>
                            <div class="action-dapan-d${i} action-dapan-d">${lesson3[i-1].dapan_d}</div>
                        </div>
                    </div>
                `;
            }
            document.getElementById("box").innerHTML = html;




            //sắp xếp lại các card item theo chiều ngang
            const box_cauhoi = document.querySelectorAll(".box-cauhoi");

            box_cauhoi.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".box").style.transform = `translateX(${i_next*(-100)}%)`
                reset_dapan_d();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".box").style.transform = `translateX(${i_next*(-100)}%)`
                reset_dapan_d();
            })

            //check đáp án

            for (let i = 1; i <= a; i++){
                document.querySelector(`.action${i}`).addEventListener("click", function(){
                    document.querySelector(`.action${i}`).style.zIndex = "-1";
                })
                document.querySelector(`.action-dapan-d${i}`).addEventListener("click", function(){
                    document.querySelector(`.action${i}`).style.zIndex = "4";
                })
            }

                
            
            function reset_dapan_d(){
                for (let i = 1; i <= a; i++){
                        document.querySelector(`.action${i}`).style.zIndex = "3";
                }
            }


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })

            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });
            
        </script>
    </body>
</html>
