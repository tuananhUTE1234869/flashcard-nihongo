<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 ことば3</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                { voca: "はん", tv: "dấu / con dấu" },
                { voca: "めいし", tv: "danh thiếp" },
                { voca: "めんきょ", tv: "giấy phép, sự cho phép" },
                { voca: "おおく", tv: "nhiều" },
                { voca: "ぜんはん", tv: "phần đầu" },
                { voca: "こうはん", tv: "phần sau" },
                { voca: "さいこう", tv: "cao nhất, tuyệt vời, rất" },
                { voca: "さいてい", tv: "thấp nhất, tồi nhất, kinh khủng" },
                { voca: "さいしょ", tv: "đầu tiên" },
                { voca: "さいご", tv: "cuối cùng" },
                { voca: "じどう", tv: "tự động" },
                { voca: "しゅるい", tv: "chủng loại, loại" },
                { voca: "せいかく", tv: "tính cách, nhân phẩm" },
                { voca: "せいしつ", tv: "tính chất, bản chất" },
                { voca: "じゅんばん", tv: "thứ tự, lần lượt" },
                { voca: "ばん", tv: "lượt, trông coi" },
                { voca: "ほうほう", tv: "phương pháp, cách thức" },
                { voca: "せいひん", tv: "sản phẩm" },
                { voca: "ねあがり", tv: "tăng giá" },
                { voca: "なま", tv: "nguyên chất, tươi, sống" },
                { voca: "かわく", tv: "Khát" },
                { voca: "かぐ", tv: "Ngửi" },
                { voca: "たたく", tv: "Đánh, gõ, vỗ" },
                { voca: "なぐる", tv: "Đấm" },
                { voca: "ける", tv: "Đá" },
                { voca: "だく", tv: "Ôm, ẵm, bế" },
                { voca: "たおれる", tv: "Ngã, đổ" },
                { voca: "たおす", tv: "Làm đổ, đánh bại" },
                { voca: "おきる/おこる", tv: "Thức dậy, thức, xảy ra" },
                { voca: "おこす", tv: "Đánh thức ai đó dậy, dựng lên, gây ra" },
                { voca: "たずねる", tv: "Hỏi, xin, yêu cầu" },
                { voca: "よぶ", tv: "Gọi, thu hút" },
                { voca: "さけぶ", tv: "Kêu, reo hò, la hét" },
                { voca: "だまる", tv: "Im lặng, làm không xin phép" },
                { voca: "かう", tv: "Nuôi (thú cưng)" },
                { voca: "かぞえる", tv: "Đếm, trong số" },
                { voca: "かわく", tv: "Khô" },
                { voca: "かわかす", tv: "Làm khô" },
                { voca: "たたむ", tv: "Gấp, xếp" },
                { voca: "さそう", tv: "Rủ, mời" }


            ];

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
