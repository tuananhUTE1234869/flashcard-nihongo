<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 かんじ -400</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

                const lesson3 = [
                    { voca: "事故", tv: "じこ sự cố" },
                    { voca: "事件", tv: "じけん sự kiện" },
                    { voca: "故障", tv: "こしょう cố chướng" },
                    { voca: "修理", tv: "しゅうり tu lý" },
                    { voca: "停電", tv: "ていでん đình điện" },
                    { voca: "調子", tv: "ちょうし điều tử" },
                    { voca: "緊張", tv: "きんちょう khẩn trương" },
                    { voca: "自信", tv: "じしん tự tín" },
                    { voca: "自慢", tv: "じまん tự mạn" },
                    { voca: "感心", tv: "かんしん cảm tâm" },
                    { voca: "感動", tv: "かんどう cảm động" },
                    { voca: "興奮", tv: "こうふん hưng phấn" },
                    { voca: "感想", tv: "かんそう cảm tưởng" },
                    { voca: "予想", tv: "よそう dự tưởng" },
                    { voca: "専門", tv: "せんもん chuyên môn" },
                    { voca: "研究", tv: "けんきゅう nghiên cứu" },
                    { voca: "調査", tv: "ちょうさ điều tra" },
                    { voca: "原因", tv: "げんいん nguyên nhân" },
                    { voca: "結果", tv: "けっか kết quả" },
                    { voca: "解決", tv: "かいけつ giải quyết" },
                    { voca: "確認", tv: "かくにん xác nhận" },
                    { voca: "利用", tv: "りよう lợi dụng" },
                    { voca: "理解", tv: "りかい lý giải" },
                    { voca: "発見", tv: "はっけん phát kiến" },
                    { voca: "発明", tv: "はつめい phát minh" },
                    { voca: "関係", tv: "かんけい quan hệ" },
                    { voca: "団体", tv: "だんたい đoàn thể" },
                    { voca: "選挙", tv: "せんきょ tuyển cử" },
                    { voca: "税金", tv: "ぜいきん thuế kim" },
                    { voca: "責任", tv: "せきにん trách nhiệm" },
                    { voca: "書類", tv: "しょるい thư loại" },
                    { voca: "題名", tv: "だいめい đề danh" },
                    { voca: "条件", tv: "じょうけん điều kiện" },
                    { voca: "締め切り", tv: "しめきり đế thiết" },
                    { voca: "期間", tv: "きかん kỳ gian" },
                    { voca: "倍", tv: "ばい bội" },
                    { voca: "近道", tv: "ちかみち cận đạo" },
                    { voca: "中心", tv: "ちゅうしん trung tâm" },
                    { voca: "辺り", tv: "あたり biên" },
                    { voca: "周り / 回り", tv: "まわり chu hồi" },
                    { voca: "穴", tv: "あな huyệt" },
                    { voca: "列", tv: "れつ liệt" },
                    { voca: "幅", tv: "はば phúc" },
                    { voca: "範囲", tv: "はんい phạm vi" },
                    { voca: "内容", tv: "ないよう nội dung" },
                    { voca: "中身", tv: "なかみ trung thân" },
                    { voca: "特徴", tv: "とくちょう đặc trưng" },
                    { voca: "普通", tv: "ふつう phổ thông" },
                    { voca: "当たり前", tv: "あたりまえ đương tiền" },
                ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
