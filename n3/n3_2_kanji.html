<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 かんじ -100</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            const lesson3 = [
                { voca: "引っ越し", tv: "ひっこし dẫn chuyển" },
                { voca: "身長", tv: "しんちょう thân-trưởng" },
                { voca: "体重", tv: "たいじゅう thể-trọng" },
                { voca: "怪我", tv: "けが quái ngã" },
                { voca: "会", tv: "かい hội" },
                { voca: "趣味", tv: "しゅみ thú-vị" },
                { voca: "興味", tv: "きょうみ hưng-vị" },
                { voca: "思い出", tv: "おもいで tư-xuất" },
                { voca: "冗談", tv: "じょうだん nhũng-đàm" },
                { voca: "目的", tv: "もくてき mục-đích" },
                { voca: "約束", tv: "やくそく ước-thúc" },
                { voca: "お喋り", tv: "おしゃべり Điệp" },
                { voca: "遠慮", tv: "えんりょ viễn-lự" },
                { voca: "我慢", tv: "がまん ngã-mạn" },
                { voca: "迷惑", tv: "めいわく mê-hoặc" },
                { voca: "希望", tv: "きぼう hy-vọng" },
                { voca: "夢", tv: "ゆめ mộng" },
                { voca: "賛成", tv: "さんせい tán-thành" },
                { voca: "反対", tv: "はんたい phản-đối" },
                { voca: "想像", tv: "そうぞう tưởng-tượng" },
                { voca: "努力", tv: "どりょく nỗ-lực" },
                { voca: "太陽", tv: "たいよう thái-dương" },
                { voca: "地球", tv: "ちきゅう địa-cầu" },
                { voca: "温度", tv: "おんど ôn-độ" },
                { voca: "湿度", tv: "しつど thấp-độ" },
                { voca: "湿気", tv: "しっけ thấp-khí" },
                { voca: "梅雨", tv: "つゆ mai-vũ" },
                { voca: "黴", tv: "かび môi" },
                { voca: "暖房", tv: "だんぼう noãn-phòng" },
                { voca: "皮", tv: "かわ bì" },
                // { voca: "缶", tv: "かん phẫu" },
                // { voca: "画面", tv: "がめん họa-diện" },
                // { voca: "番組", tv: "ばんぐみ phiên-tổ" },
                // { voca: "記事", tv: "きじ ký-sự" },
                // { voca: "近所", tv: "きんじょ cận-sở" },
                // { voca: "警察", tv: "けいさつ cảnh-sát" },
                // { voca: "犯人", tv: "はんにん phạm-nhân" },
                // { voca: "小銭", tv: "こぜに tiểu-tiễn" },
                // { voca: "ご馳走", tv: "ごちそう trì-tẩu" },
                // { voca: "作者", tv: "さくしゃ tác-giả" },
                // { voca: "作品", tv: "さくひん tác-phẩm" },
                // { voca: "制服", tv: "せいふく chế-phục" },
                // { voca: "洗剤", tv: "せんざい tẩy-tễ" },
                // { voca: "底", tv: "そこ để" },
                // { voca: "地下", tv: "ちか địa-hạ" },
                // { voca: "寺", tv: "てら tự" },
                // { voca: "道路", tv: "どうろ đạo-lộ" },
                // { voca: "坂", tv: "さか phản" },
                // { voca: "煙", tv: "けむり yên" },
                // { voca: "灰", tv: "はい hôi" }
            ];



            let a = lesson3.length;
            console.log(a); // 5
            console.log(lesson3);

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
