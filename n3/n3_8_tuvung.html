<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 ことば -400</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                { voca: "じこ", tv: "Tai nạn" },
                { voca: "じけん", tv: "Biến cố, sự việc" },
                { voca: "こしょう", tv: "Sự cố, phá vỡ, hỏng" },
                { voca: "しゅうり", tv: "Sửa chữa" },
                { voca: "ていでん", tv: "Mất điện" },
                { voca: "ちょうし", tv: "Tình trạng, âm điệu" },
                { voca: "きんちょう", tv: "Căng thẳng, lo lắng" },
                { voca: "じしん", tv: "Tự tin" },
                { voca: "じまん", tv: "Tự hào, khoe khoang" },
                { voca: "かんしん", tv: "Ngưỡng mộ, đáng được khen ngợi" },
                { voca: "かんどう", tv: "Bị xúc động, cảm động" },
                { voca: "こうふん", tv: "Hưng phấn" },
                { voca: "かんそう", tv: "Cảm giác, ấn tượng" },
                { voca: "よそう", tv: "Dự đoán" },
                { voca: "せんもん", tv: "Chuyên môn" },
                { voca: "けんきゅう", tv: "Nghiên cứu, tìm hiểu, học tập" },
                { voca: "ちょうさ", tv: "Điều tra, khảo sát" },
                { voca: "げんいん", tv: "Nguyên nhân" },
                { voca: "けっか", tv: "Kết quả" },
                { voca: "かいけつ", tv: "Giải quyết" },
                { voca: "かくにん", tv: "Xác nhận, xác minh" },
                { voca: "りよう", tv: "Sử dụng, khai thác" },
                { voca: "りかい", tv: "Hiểu" },
                { voca: "はっけん", tv: "Khám phá, tìm thấy, phát hiện" },
                { voca: "はつめい", tv: "Phát minh" },
                { voca: "かんけい", tv: "Quan hệ" },
                { voca: "だんたい", tv: "Nhóm, đoàn thể" },
                { voca: "せんきょ", tv: "Cuộc bầu cử" },
                { voca: "ぜいきん", tv: "Thuế" },
                { voca: "せきにん", tv: "Trách nhiệm" },
                { voca: "しょるい", tv: "Tài liệu, hồ sơ, giấy tờ" },
                { voca: "だいめい", tv: "Nhan đề, tên (sách...)" },
                { voca: "じょうけん", tv: "Điều kiện" },
                { voca: "しめきり", tv: "Hạn cuối" },
                { voca: "きかん", tv: "Kỳ, thời kỳ" },
                { voca: "ばい", tv: "Gấp đôi, lần" },
                { voca: "くじ", tv: "Rút thăm, điều may rủi, xổ số" },
                { voca: "ちかみち", tv: "Đường tắt" },
                { voca: "ちゅうしん", tv: "Trung tâm" },
                { voca: "あたり", tv: "Xung quanh, vùng lân cận" },
                { voca: "まわり", tv: "Vòng quanh, xung quanh" },
                { voca: "あな", tv: "Lỗ" },
                { voca: "れつ", tv: "Hàng, dòng" },
                { voca: "はば", tv: "Chiều rộng, phạm vi" },
                { voca: "はんい", tv: "Phạm vi" },
                { voca: "ないよう", tv: "Nội dung" },
                { voca: "なかみ", tv: "Bên trong, nội dung" },
                { voca: "とくちょう", tv: "Đặc trưng, đặt tính" },
                { voca: "ふつう", tv: "Bình thường, thông thường" },
                { voca: "あたりまえ", tv: "Dĩ nhiên, đương nhiên" },
            ];

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
