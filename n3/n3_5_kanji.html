<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 かんじ -250</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                { voca: "剥く", tv: "むく bác" },
                { voca: "滑る", tv: "すべる hoạt" },
                { voca: "積もる", tv: "つもる tích" },
                { voca: "積む", tv: "つむ tích" },
                { voca: "空く", tv: "あく không" },
                { voca: "空ける", tv: "あける không" },
                { voca: "下がる", tv: "さがる hạ" },
                { voca: "下げる", tv: "さげる hạ" },
                { voca: "冷える", tv: "ひえる lãnh" },
                { voca: "冷やす", tv: "ひやす lãnh" },
                { voca: "冷める", tv: "さめる lãnh" },
                { voca: "冷ます", tv: "さます lãnh" },
                { voca: "燃える", tv: "もえる nhiên" },
                { voca: "燃やす", tv: "もやす nhiên" },
                { voca: "沸く", tv: "わく phí" },
                { voca: "沸かす", tv: "わかす phí" },
                { voca: "鳴る", tv: "なる minh" },
                { voca: "鳴らす", tv: "ならす minh" },
                { voca: "役立つ / 役に立つ", tv: "やくだつ / やくにたつ dịch lập" },
                { voca: "役立てる / 役に立てる", tv: "やくだてる / やくにたてる dịch lập" },
                { voca: "飾り", tv: "かざり sức" },
                { voca: "遊び", tv: "あそび du" },
                { voca: "集まり", tv: "あつまり tập" },
                { voca: "教え", tv: "おしえ giáo" },
                { voca: "踊り", tv: "おどり dũng" },
                { voca: "思い", tv: "おもい tư" },
                { voca: "考え", tv: "かんがえ khảo" },
                { voca: "片付け", tv: "かたづけ phiến/phó" },
                { voca: "手伝い", tv: "てつだい thủ/truyền" },
                { voca: "働き", tv: "はたらき động" },
                { voca: "決まり", tv: "きまり quyết" },
                { voca: "騒ぎ", tv: "さわぎ tao" },
                { voca: "知らせ", tv: "しらせ tri" },
                { voca: "頼み", tv: "たのみ lại" },
                { voca: "疲れ", tv: "つかれ bì" },
                { voca: "違い", tv: "ちがい vi" },
                { voca: "始め", tv: "はじめ thủy" },
                { voca: "続き", tv: "つづき tục" },
                { voca: "暮れ", tv: "くれ mộ" },
                { voca: "行き", tv: "いき hành" },
                { voca: "帰り", tv: "かえり quy" },
                { voca: "急ぎ", tv: "いそぎ cấp" },
                { voca: "遅れ", tv: "おくれ trì" },
                { voca: "貸し", tv: "かし thải" },
                { voca: "借り", tv: "かり tá" },
                { voca: "勝ち", tv: "かち thắng" },
                { voca: "負け", tv: "まけ phụ" },
                { voca: "迎え", tv: "むかえ nghênh" },
                { voca: "始まり", tv: "はじまり thủy" },
                { voca: "終わり", tv: "おわり chung" },
            ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
