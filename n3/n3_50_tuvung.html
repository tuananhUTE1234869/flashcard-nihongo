<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>ことば N4</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [

                { voca: "間もなく", tv: "まもなく(gian) Chẳng bao lâu nữa, sắp" },
                { voca: "扇風機", tv: "せんぷうき(phiến phong cơ) máy quạt điện" },
                { voca: "山道", tv: "やまみち(sơn đạo) Đường núi" },
                { voca: "景色", tv: "けしき(cảnh sắc) phong cảnh, cảnh sắc" },
                { voca: "配達", tv: "はいたつ(phối đạt) giao hàng, phát hàng" },
                { voca: "本人", tv: "ほんにん(bản nhân) Bản thân, chính người đó" },
                { voca: "確か", tv: "たしか(xác) đúng là, quả thật" },
                { voca: "確かめる", tv: "たしかめる(xác) xác nhận, kiểm tra" },
                { voca: "畑", tv: "はたけ ruộng,nương rẫy" },
                { voca: "辺", tv: "へん(biên) khu vực, vùng" },
                { voca: "虫", tv: "むし(trùng) con trùng, sâu bọ" },
                { voca: "地方", tv: "ちほう(địa phương) địa phương, vùng miền" },
                { voca: "偶然", tv: "ぐうぜん(ngẫu nhiên) tình cờ, ngẫu nhiên" },
                { voca: "寄る", tv: "よる(ký) ghé vào, tạc vào" },
                { voca: "刺身", tv: "さしみ(thích thân) sashimi" },
                { voca: "新鮮", tv: "しんせん(tân tiên) tươi mới, tươi" },
                { voca: "本物", tv: "ほんもの(bản vật) đồ thật" },
                { voca: "人生", tv: "じんせい(nhân sinh) đời người, kiếp người" },
                { voca: "夢中", tv: "むちゅう(mộng trung) Say mê, mê mẩn" },
                { voca: "深い", tv: "ふかい(thâm) sâu thâm, độ sâu" },
                { voca: "労働", tv: "ろうどう (Lao động) làm việc, lao động" },
                { voca: "工夫", tv: "くふう(Công phu) sự khéo léo, công phu" },
                { voca: "能力", tv: "のうりょく(năng lực) năng lực, khả năng" },
                { voca: "きつい", tv: "Khó nhọc, vất vả, khắc nghiệt" },
                { voca: "辛い", tv: "つらい(tân) cay, vất vả, gian khổ" },
                { voca: "観光客", tv: "かんこうきゃく(Quan Quang Khách) khách du lịch" },
                { voca: "大勢", tv: "おおぜい(đại thế) nhiều người" },
                { voca: "凍る", tv: "こおる(đống) đống băng" },
                { voca: "旅行先", tv: "りょこうさき(lữ hành tiên) điểm du lịch, nơi du lịch" },
                { voca: "土地", tv: "とち(thổ địa) đất, mảnh đất" },
                { voca: "残念", tv: "ざんねん(tàn niệm) đáng tiếc, nuối tiếc" },
                { voca: "ずるい", tv: "Gian xảo, không công bằng" },
                { voca: "涼しい", tv: "すずしい(lương) mát mẻ" },
                { voca: "繰り返す", tv: "くりかえす(chức phản) Lặp lại, làm đi làm lại" },
                { voca: "探す", tv: "さがす(thám) tìm kiếm" },
                { voca: "危険", tv: "きけん(Nguy hiểm)" },
                { voca: "姿", tv: "すがた(tư) dáng vẽ, hình dạng" },
                { voca: "変化", tv: "へんか(biến hóa) sự thay đổi,sự biến đổi" },
                { voca: "詳しい", tv: "くわしい(tường) chi tiết, tường tận" },
                { voca: "案", tv: "あん(án) phương án" },
                { voca: "せっかく", tv: "mất công mới, tiện thể" },
                { voca: "痛み", tv: "いたみ(thống) cơn đau" },
                { voca: "発売", tv: "はつばい(phát mại) bán ra thị trường" },
                { voca: "今後", tv: "こんご(kim hậu) từ nay về sau, từ nay" },
                { voca: "満足", tv: "まんぞく(mãn túc) hài lòng, thỏa mãn" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },


            ];

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
