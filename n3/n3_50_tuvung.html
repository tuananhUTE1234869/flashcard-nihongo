<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>ことば N4</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                { voca: "こくれん", tv: "Liên Hợp Quốc" },
                { voca: "しんゆう", tv: "bạn thân" },
                { voca: "ほとんど", tv: "hầu như, hầu hết" },
                { voca: "しょうちする", tv: "hiểu rõ, biết, đồng ý" },
                { voca: "ちゅうしゃする", tv: "Đỗ xe, đậu xe/ Tiêm, chích thuốc" },
                { voca: "たちば", tv: "Lập trường, góc độ" },
                { voca: "せいじ", tv: "Chính trị" },
                { voca: "こくみん", tv: "Nhân dân, người dân" },
                { voca: "そんけい", tv: "Kính trọng, tôn kính" },
                { voca: "ていねい", tv: "Lịch sự, cẩn thận, chu đáo, tỉ mỉ" },
                { voca: "おかげさまで", tv: "nhờ ơn (trời)" },
                { voca: "ごめんなさい", tv: "Xin lỗi, tôi xin lỗi" },
                { voca: "おげんきで", tv: "Giữ gìn sức khỏe nhé!" },
                { voca: "どういたしまして", tv: "không có gì" },
                { voca: "おじゃまします", tv: "Xin lỗi vì đã làm phiền / Cháu/tôi xin phép vào nhà ạ" },
                { voca: "こうじ", tv: "Thi công, công trình, xây dựng" },
                { voca: "こんかい", tv: "Lần này, dịp này" },
                { voca: "やはり", tv: "Quả nhiên là, đúng như dự đoán, quả thật là" },
                { voca: "けっして", tv: "Tuyệt đối/Nhất định (không)..." },
                { voca: "かんごし", tv: " y tá" },
                { voca: "くび", tv: "cổ (con người)" },
                { voca: "ゆび", tv: "ngón tay (con người)" },
                { voca: "ちから", tv: "sức mạnh, sức lực" },
                { voca: "ゆうはん", tv: "bữa tối, cơm tối" },
                { voca: "こんかい", tv: "lần này" },
                { voca: "せいよう", tv: "phương tây" },
                { voca: "しょくりょうひん", tv: "Thực phẩm, đồ ăn thức uống, nhu yếu phẩm hàng ngày" },
                { voca: "ぐたいてき", tv: "Rõ ràng, chi tiết" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },
                { voca: "", tv: "" },

            ];

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
