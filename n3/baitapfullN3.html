<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="baitap.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
            .box_chonthe {
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                /* background-color: red; */
                width: 100%;
                /* height: 50px; */
            }
                .input_the {
                    padding: 10px 0px;
                    border: 5px solid rgb(123, 255, 0);
                    display: flex;
                    width: 50%;
                    height: 100px;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background-color: white;
                }
            .show_the {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 10px;
                background-color: white;
                border: 5px solid rgb(123, 255, 0);
                width: 50%;
                height: 100px;

            }
            .titlefull > h1 {
                font-size: 40px !important;
            }



        </style>
    </head>
    <body>
        <div class="titlefull"><h1>TEST BAITAP N3</h1></div>
        <div class="frame-box">
            <div class="box" id="box">
            
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <div class="box_chonthe">
            <div class="input_the">
                <label for="#">Nhập số bài kanji: </label>
                <input type="number" name="sothe" id="sothe"><br>
                <button onclick="thembai()">Thêm</button>
                <button onclick="xoabai()" style="margin-top: 10px;">Clear</button>
            </div>
            <div class="show_the">
                <div class="s1"><p id="show_BaiDaChon"></p></div>
                <div class="s2"><button onclick="timfile()">Kiểm tra</button></div>
            </div>
        </div>
        <script>
            
            let lesson3= [];

            function runjs(){

                // tạo thẻ 


                    let a = lesson3.length;
                    console.log("kiem tra lai",a); // 5

                    let html = "";

                    //random + format chung của flasd card
                    for (let i = lesson3.length - 1; i > 0; i--) {
                        let j = Math.floor(Math.random() * (i + 1));
                        [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
                    }



                    for (let i = 1; i <= a; i++) {

                            // Lấy 4 đáp án và random thứ tự
                        let dapan = [
                            lesson3[i-1].a,
                            lesson3[i-1].b,
                            lesson3[i-1].c,
                            lesson3[i-1].d
                        ];
                        dapan.sort(() => Math.random() - 0.5);


                        html += `
                            <div class="box-cauhoi${i} box-cauhoi">
                                <div class="cauhoi">
                                    ${lesson3[i-1].cauhoi}
                                </div>
                                <div class="dapan">
                                    <div class="dapan-up huong">
                                        <div class="a item">
                                            ${dapan[0]}
                                        </div>
                                        <div class="b item">
                                            ${dapan[1]}
                                        </div>
                                    </div>
                                    <div class="dapan-down huong">
                                        <div class="c item">
                                            ${dapan[2]}
                                        </div>
                                        <div class="d item">
                                            ${dapan[3]}
                                        </div>
                                    </div>
                                </div>
                                <div class="dapan-d">
                                    <div class="action${i} action"></div>
                                    <div class="action-dapan-d${i} action-dapan-d">${lesson3[i-1].dapan_d}</div>
                                </div>
                            </div>
                        `;
                    }
                    document.getElementById("box").innerHTML = html;


                    //sắp xếp lại các card item theo chiều ngang
                    const box_cauhoi = document.querySelectorAll(".box-cauhoi");

                    box_cauhoi.forEach((el,index)=>{
                        el.style.transform = `translateX(${index * 100}%)`;
                    })
                    
                    

                    // next 
                    let i_next = 0;
                    const next = document.querySelector(".next")
                    const back = document.querySelector(".back")

                    back.addEventListener("click", function(){
                        i_next = i_next - 1;
                        if (i_next < 0){
                            i_next = (a-1);
                        }
                        document.querySelector(".box").style.transform = `translateX(${i_next*(-100)}%)`
                        reset_dapan_d();
                    })
                    next.addEventListener("click", function(){
                        i_next = i_next + 1;
                        if (i_next > (a-1)){
                            i_next = 0;
                        }
                        document.querySelector(".box").style.transform = `translateX(${i_next*(-100)}%)`
                        reset_dapan_d();
                    })
                    

                    //check đáp án
                    for (let i = 1; i <= a; i++){
                        document.querySelector(`.action${i}`).addEventListener("click", function(){
                            document.querySelector(`.action${i}`).style.zIndex = "-1";
                        })
                        document.querySelector(`.action-dapan-d${i}`).addEventListener("click", function(){
                            document.querySelector(`.action${i}`).style.zIndex = "4";
                        })
                    }

                        
                    
                    function reset_dapan_d(){
                        for (let i = 1; i <= a; i++){
                                document.querySelector(`.action${i}`).style.zIndex = "3";
                        }
                    }



            }


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });





            // Thêm bài từ vựng
            let Fullbai = [];
            function thembai(){
                const sobai = document.getElementById("sothe").value;
                if ((sobai <= 0) || (sobai > 50)){
                    return;
                }else if (!sobai){
                    return;
                }
                let lg = Fullbai.length;
                console.log(lg);
                for (let i=0; i<lg; i++){
                    if (sobai==Fullbai[i]){
                        console.log("trung");
                        return;
                    } else  {
                        
                    }
                }
                
                Fullbai.push(Number(sobai));
                console.log(Fullbai);
                document.getElementById("show_BaiDaChon").textContent= Fullbai.join(",");
            }

            // xóa từ vựng thêm trong array 
            function xoabai(){
                Fullbai = [];
                document.getElementById("show_BaiDaChon").textContent="";

            }


            // phần bổ sung cho pladcard full

            async function timfile(bb) {

                let tf_lg = Fullbai.length;
                // console.log("dodai:",tf_lg);
                

                // syntax để lấy dữ liệu từ vựng 
                const namefile = [];
                for (let i=0; i<tf_lg; i++){
        
                    namefile[i]=`baitap${Fullbai[i]}.html`;
                }
                // console.log("array:",namefile);
                // let a = `lesson1_tuvung.html`;

                let arrayTuVung = [];
                for (let i=0; i<tf_lg; i++){
                    try {
                    //truy vấn tìm file trong foder
                    const respone = await fetch(namefile[i]);

                    // lấy nội dung 
                    const html = await respone.text();


                    // tìm thẻ js
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");
                    const scripts = doc.querySelectorAll("script");


                    // tìm array lesson 3
                    for (const script of scripts) {

                        const text = script.textContent;

                        if (text.includes("const lesson3")) {

                            const lesson = new Function(
                                text + "\nreturn lesson3;"
                            )();

                            arrayTuVung.push(...lesson);

                            break;
                        }
                    }

                    // if (!arrayTuVung) {
                    //     throw new Error("Không tìm thấy array lesson3");
                    // }
                    console.log("final",arrayTuVung);
                    console.log("final",arrayTuVung.length);
                    
                    }

                    catch (error) {

                        // document.getElementById("result").textContent =
                        //     error.message;

                    }
                }
                console.log("f1",arrayTuVung);
                console.log("f1",arrayTuVung.length);

                lesson3 = arrayTuVung;
                runjs();

            }
            




        </script>
    </body>
</html>
