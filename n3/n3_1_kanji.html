<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 かんじ -50</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

           const lesson3 = [
                { voca: "男性", tv: "だんせい nam tính" },
                { voca: "女性", tv: "じょせい nữ tính" },
                { voca: "高齢", tv: "こうれい cao linh" },
                { voca: "年上", tv: "としうえ niên thượng" },
                { voca: "目上", tv: "めうえ mục thượng" },
                { voca: "先輩", tv: "せんぱい tiên bối" },
                { voca: "後輩", tv: "こうはい hậu bối" },
                { voca: "上司", tv: "じょうし thượng tư" },
                { voca: "相手", tv: "あいて tương thủ" },
                { voca: "知り合い", tv: "し(り)あ(い) tri hợp" },
                { voca: "友人", tv: "ゆうじん hữu nhân" },
                { voca: "仲", tv: "なか trọng" },
                { voca: "生年月日", tv: "せいねんがっぴ sinh niên nguyệt nhật" },
                { voca: "誕生", tv: "たんじょう đản sinh" },
                { voca: "年", tv: "とし niên" },
                { voca: "出身", tv: "しゅっしん xuất thân" },
                { voca: "故郷", tv: "こきょう cố hương" },
                { voca: "成長", tv: "せいちょう thành công" },
                { voca: "成人", tv: "せいじん thành nhân" },
                { voca: "合格", tv: "ごうかく hợp cách" },
                { voca: "進学", tv: "しんがく tiến học" },
                { voca: "退学", tv: "たいがく thoái học" },
                { voca: "就職", tv: "しゅうしょく tựu chức" },
                { voca: "退職", tv: "たいしょく thoái chức" },
                { voca: "失業", tv: "しつぎょう thất nghiệp" },
                { voca: "残業", tv: "ざんぎょう tàn nghiệp" },
                { voca: "生活", tv: "せいかつ sinh hoạt" },
                { voca: "通勤", tv: "つうきん thông cần" },
                { voca: "学歴", tv: "がくれき học lịch" },
                { voca: "給料", tv: "きゅうりょう cấp liệu" },
                { voca: "面接", tv: "めんせつ diện tiếp" },
                { voca: "休憩", tv: "きゅうけい hưu khế" },
                { voca: "観光", tv: "かんこう quan quang" },
                { voca: "帰国", tv: "きこく quy quốc" },
                { voca: "帰省", tv: "きせい quy tỉnh" },
                { voca: "帰宅", tv: "きたく quy trạch" },
                { voca: "参加", tv: "さんか tham gia" },
                { voca: "出席", tv: "しゅっせき xuất tịch" },
                { voca: "欠席", tv: "けっせき khuyết tịch" },
                { voca: "遅刻", tv: "ちこく trì khác" },
                { voca: "化粧", tv: "けしょう hóa trang" },
                { voca: "計算", tv: "けいさん kế toán" },
                { voca: "計画", tv: "けいかく kế họa" },
                { voca: "成功", tv: "せいこう thành công" },
                { voca: "失敗", tv: "しっぱい thất bại" },
                { voca: "準備", tv: "じゅんび chuẩn bị" },
                { voca: "整理", tv: "せいり chỉnh lý" },
                { voca: "注文", tv: "ちゅうもん trú văn" },
                { voca: "貯金", tv: "ちょきん trữ kim" },
                { voca: "徹夜", tv: "てつや triệt dạ" },
                
                ];

            let a = lesson3.length;
            console.log(a); // 5
            console.log(lesson3);

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
