<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 かんじ -450</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

                const lesson3 = [
                    { voca: "偽", tv: "にせ ngụy" },
                    { voca: "別", tv: "べつ biệt" },
                    { voca: "国籍", tv: "こくせき quốc tịch" },
                    { voca: "東洋", tv: "とうよう đông dương" },
                    { voca: "西洋", tv: "せいよう tây dương" },
                    { voca: "国際", tv: "こくさい quốc tế" },
                    { voca: "自然", tv: "しぜん tự nhiên" },
                    { voca: "景色", tv: "けしき cảnh sắc" },
                    { voca: "宗教", tv: "しゅうきょう tông giáo" },
                    { voca: "愛", tv: "あい ái" },
                    { voca: "届く", tv: "とどく giới" },
                    { voca: "届ける", tv: "とどける giới" },
                    { voca: "握る", tv: "にぎる ác" },
                    { voca: "押さえる", tv: "おさえる áp" },
                    { voca: "近づく", tv: "ちかづく cận" },
                    { voca: "近づける", tv: "ちかづける cận" },
                    { voca: "合う", tv: "あう gặp" },
                    { voca: "合わせる", tv: "あわせる hợp" },
                    { voca: "当たる", tv: "あたる đương" },
                    { voca: "当てる", tv: "あてる đương" },
                    { voca: "比べる", tv: "くらべる tỉ" },
                    { voca: "似合う", tv: "にあう tự hợp" },
                    { voca: "似る", tv: "にる tự" },
                    { voca: "似せる", tv: "にせる tự" },
                    { voca: "分かれる", tv: "わかれる phân" },
                    { voca: "分ける", tv: "わける phân" },
                    { voca: "足す", tv: "たす túc" },
                    { voca: "引く", tv: "ひく dẫn" },
                    { voca: "増える", tv: "ふえる tăng" },
                    { voca: "増やす", tv: "ふやす tăng" },
                    { voca: "減る", tv: "へる giảm" },
                    { voca: "減らす", tv: "へらす giảm" },
                    { voca: "変わる", tv: "かわる biến" },
                    { voca: "変える", tv: "かえる biến" },
                    { voca: "替わる / 代わる / 換わる", tv: "かわる thế/đại/hoán" },
                    { voca: "替える / 代える / 換える", tv: "かえる thế/đại/hoán" },
                    { voca: "返る", tv: "かえる phản" },
                    { voca: "返す", tv: "かえす phản" },
                    { voca: "譲る", tv: "ゆずる nhượng" },
                    { voca: "助かる", tv: "たすかる trợ" },
                    { voca: "助ける", tv: "たすける trợ" },
                    { voca: "盗む", tv: "ぬすむ đạo" },
                    { voca: "刺さる", tv: "ささる thú" },
                    { voca: "刺す", tv: "さす thứ" },
                    { voca: "殺す", tv: "ころす sát" },
                    { voca: "隠れる", tv: "かくれる ẩn" }
                ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
