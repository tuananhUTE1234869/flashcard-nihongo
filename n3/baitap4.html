<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="baitap.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>Bài Tập 5-6</h1></div>

        <div class="frame-box">
            <div class="box" id="box">
            
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>


        <script>

            const lesson3 = [
                // 5課 (Câu 1 - 9)
                { cauhoi: "パソコンがこわれてしまったために、（  ）。",
                    a: "新しいのを買おう",
                    b: "資料が作れなかった",
                    c: "直してくれませんか",
                    d: "",
                dapan_d: "資料が作れなかった" },

                { cauhoi: "台風15号によって（  ）。",
                    a: "橋が流された",
                    b: "明日は大雨だろう",
                    c: "明日は外出したくない",
                    d: "",
                dapan_d: "橋が流された" },

                { cauhoi: "高い技術（  ）詳しい健康チェックができるようになった。",
                    a: "によって",
                    b: "によれば",
                    c: "によると",
                    d: "",
                dapan_d: "によって" },

                { cauhoi: "小さな不注意（  ）大問題が起こることもある。",
                    a: "から",
                    b: "まで",
                    c: "には",
                    d: "",
                dapan_d: "から" },

                { cauhoi: "自転車の事故が増えたことから、（  ）。",
                    a: "気をつけよう",
                    b: "自転車には乗りたくない",
                    c: "警察の注意がきびしくなった",
                    d: "",
                dapan_d: "警察の注意がきびしくなった" },

                { cauhoi: "弟のせいで（  ）。",
                    a: "楽しかった",
                    b: "よく遊べた",
                    c: "母にしかられた",
                    d: "",
                dapan_d: "母にしかられた" },

                { cauhoi: "この薬（  ）病気を治すことができた。",
                    a: "のおかげで",
                    b: "のせいで",
                    c: "から",
                    d: "",
                dapan_d: "のおかげで" },

                { cauhoi: "やっと運転免許が取れたんだから、（  ）。",
                    a: "車を買った",
                    b: "車を買いたい",
                    c: "車は買わなかった",
                    d: "",
                dapan_d: "車を買いたい" },

                { cauhoi: "先生、すみません。かぜをひいて（  ）、今日は休ませてください。",
                    a: "しまったので",
                    b: "しまったんですから",
                    c: "しまって",
                    d: "",
                dapan_d: "しまったので" },

                // 6課 (Câu 10 - 17)
                { cauhoi: "会社員A「ぼく、5時の新幹線に乗るんだ。あ、遅れそうだ。急がないと……。」会社員B「（  ）なら後片付けはわたしがやっておくから、早く行って。」",
                    a: "遅れない",
                    b: "急がない",
                    c: "時間がない",
                    d: "",
                dapan_d: "時間がない" },

                { cauhoi: "体の調子が悪くては（  ）。",
                    a: "仕事が進まないだろう",
                    b: "仕事を休んでもいいよ",
                    c: "あした仕事をしよう",
                    d: "",
                dapan_d: "仕事が進まないだろう" },

                { cauhoi: "一人暮らしでも、お金さえ（  ）。",
                    a: "なければ困る",
                    b: "あれば困らない",
                    c: "なければアルバイトをする",
                    d: "",
                dapan_d: "あれば困らない" },

                { cauhoi: "ハンドルさえ直せばこの自転車は（  ）だろう。",
                    a: "もう使えない",
                    b: "まだ使える",
                    c: "使いにくい",
                    d: "",
                dapan_d: "まだ使える" },

                { cauhoi: "たとえどんなに（  ）、賛成する人が少なければ実行できない。",
                    a: "よくない案でも",
                    b: "いい案でも",
                    c: "案を考えなくても",
                    d: "",
                dapan_d: "いい案でも" },

                { cauhoi: "たとえ国を離れても、ぼくは君のことを（  ）。",
                    a: "忘れないよ",
                    b: "忘れるかもしれない",
                    c: "もう思い出せない",
                    d: "",
                dapan_d: "忘れないよ" },

                { cauhoi: "ああ、よかった。気がつくのが（  ）火事になったかもしれない。",
                    a: "遅いと",
                    b: "遅いなら",
                    c: "遅かったら",
                    d: "",
                dapan_d: "遅かったら" },

                { cauhoi: "学生時代にもっと勉強すれば（  ）と、今ではとても残念だ。",
                    a: "いい",
                    b: "よさそうだ",
                    c: "よかった",
                    d: "",
                dapan_d: "よかった" },

                // 5課・6課 (Câu 18 - 27)
                { cauhoi: "今年は梅雨に雨の量が少なかった（  ）、米や野菜などがよく育っていない。",
                    a: "おかげで",
                    b: "ために",
                    c: "のなら",
                    d: "",
                dapan_d: "ために" },

                { cauhoi: "今日は（  ）、早く家に帰りたい。",
                    a: "疲れたせいで",
                    b: "疲れたのでは",
                    c: "疲れたから",
                    d: "",
                dapan_d: "疲れたから" },

                { cauhoi: "あなたは（  ）どんな仕事でもするんですか。",
                    a: "給料さえ高ければ",
                    b: "給料が高いのでは",
                    c: "給料が高いのだから",
                    d: "",
                dapan_d: "給料さえ高ければ" },

                { cauhoi: "せっかく京都まで（  ）、京都にしかない物を食べませんか。",
                    a: "来たのでは",
                    b: "来たことから",
                    c: "来たんだから",
                    d: "",
                dapan_d: "来たんだから" },

                { cauhoi: "ひろしは絵を（  ）、デザインの仕事に興味を持ったようだ。",
                    a: "ほめられたのだから",
                    b: "ほめられたことから",
                    c: "ほめられさえすれば",
                    d: "",
                dapan_d: "ほめられたことから" },

                { cauhoi: "太陽熱（  ）発電は、24時間可能だ。",
                    a: "から",
                    b: "による",
                    c: "のための",
                    d: "",
                dapan_d: "による" },

                { cauhoi: "オートバイを（  ）、今、お金をためています。",
                    a: "買いたいなら",
                    b: "買いたいので",
                    c: "買いたいのでは",
                    d: "",
                dapan_d: "買いたいので" },

                { cauhoi: "ホームステイに（  ）、早く申し込みをしたほうがいいですよ。",
                    a: "参加すれば",
                    b: "参加するため",
                    c: "参加するなら",
                    d: "",
                dapan_d: "参加するなら" },

                { cauhoi: "そんなにほめ言葉を（  ）、かえって恥ずかしいです。",
                    a: "言われては",
                    b: "言われたのだから",
                    c: "言われさえすれば",
                    d: "",
                dapan_d: "言われては" },

                { cauhoi: "たとえどんなにいい服を（  ）着る機会がなかったら意味がない。",
                    a: "買ったのだから",
                    b: "買っても",
                    c: "買ったのでは",
                    d: "",
                dapan_d: "買っても" }
            ];
           

            let a = lesson3.length;
            console.log(a); // 5
            
            let html = "";

            //ramdom
            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }



            for (let i = 1; i <= a; i++) {

                    // Lấy 4 đáp án và random thứ tự
                let dapan = [
                    lesson3[i-1].a,
                    lesson3[i-1].b,
                    lesson3[i-1].c,
                    lesson3[i-1].d
                ];
                dapan.sort(() => Math.random() - 0.5);


                html += `
                    <div class="box-cauhoi${i} box-cauhoi">
                        <div class="cauhoi">
                            ${lesson3[i-1].cauhoi}
                        </div>
                        <div class="dapan">
                            <div class="dapan-up huong">
                                <div class="a item">
                                    ${dapan[0]}
                                </div>
                                <div class="b item">
                                    ${dapan[1]}
                                </div>
                            </div>
                            <div class="dapan-down huong">
                                <div class="c item">
                                    ${dapan[2]}
                                </div>
                                <div class="d item">
                                    ${dapan[3]}
                                </div>
                            </div>
                        </div>
                        <div class="dapan-d">
                            <div class="action${i} action"></div>
                            <div class="action-dapan-d${i} action-dapan-d">${lesson3[i-1].dapan_d}</div>
                        </div>
                    </div>
                `;
            }
            document.getElementById("box").innerHTML = html;




            //sắp xếp lại các card item theo chiều ngang
            const box_cauhoi = document.querySelectorAll(".box-cauhoi");

            box_cauhoi.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".box").style.transform = `translateX(${i_next*(-100)}%)`
                reset_dapan_d();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".box").style.transform = `translateX(${i_next*(-100)}%)`
                reset_dapan_d();
            })

            //check đáp án

            for (let i = 1; i <= a; i++){
                document.querySelector(`.action${i}`).addEventListener("click", function(){
                    document.querySelector(`.action${i}`).style.zIndex = "-1";
                })
                document.querySelector(`.action-dapan-d${i}`).addEventListener("click", function(){
                    document.querySelector(`.action${i}`).style.zIndex = "4";
                })
            }

                
            
            function reset_dapan_d(){
                for (let i = 1; i <= a; i++){
                        document.querySelector(`.action${i}`).style.zIndex = "3";
                }
            }


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })

            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });
            
        </script>
    </body>
</html>
