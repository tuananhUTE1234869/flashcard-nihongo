<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 かんじ -200</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                { voca: "断る", tv: "ことわる đoạn" },
                { voca: "見つかる", tv: "みつかる kiến" },
                { voca: "見つける", tv: "みつける kiến" },
                { voca: "捕まる", tv: "つかまる bó" },
                { voca: "捕まえる", tv: "つかまえる bó" },
                { voca: "乗る", tv: "のる thừa" },
                { voca: "乗せる", tv: "のせる thừa" },
                { voca: "降りる/下りる", tv: "おりる giáng/hạ" },
                { voca: "降ろす/下ろす", tv: "おろす giáng/hạ" },
                { voca: "直る", tv: "なおる trực" },
                { voca: "直す", tv: "なおす trực" },
                { voca: "治る", tv: "なおる trị" },
                { voca: "治す", tv: "なおす trị" },
                { voca: "亡くなる", tv: "なくなる vong" },
                { voca: "亡くす", tv: "なくす vong" },
                { voca: "生まれる", tv: "うまれる sinh" },
                { voca: "産む/生む", tv: "うむ sản/sinh" },
                { voca: "出会う", tv: "であう xuất hội" },
                { voca: "訪ねる", tv: "たずねる phỏng" },
                { voca: "付き合う", tv: "つきあう phó hợp" },
                { voca: "効く", tv: "きく hiệu" },
                { voca: "経つ", tv: "たつ kinh" },
                { voca: "間に合う", tv: "まにあう gian hợp" },
                { voca: "間に合わせる", tv: "まにあわせる gian hợp" },
                { voca: "通う", tv: "かよう thông" },
                { voca: "込む", tv: "こむ nhập" },
                { voca: "すれ違う", tv: "すれちがう vi" },
                { voca: "掛かる", tv: "かかる quải" },
                { voca: "掛ける", tv: "かける quải" },
                { voca: "動く", tv: "うごく động" },
                { voca: "動かす", tv: "うごかす động" },
                { voca: "離れる", tv: "はなれる ly" },
                { voca: "離す", tv: "はなす ly" },
                { voca: "片付く", tv: "かたづく phiến phó" }, // 190
                { voca: "片付ける", tv: "かたづける phiến phó" }, // 191
                { voca: "包む", tv: "つつむ bao" }, // 192
                { voca: "張る", tv: "はる trương" }, // 193
                { voca: "無くなる", tv: "なくなる vô" }, // 194
                { voca: "無くす", tv: "なくす vô" }, // 195
                { voca: "足りる", tv: "たりる túc" }, // 196
                { voca: "残る", tv: "のこる tàn" }, // 197
                { voca: "残す", tv: "のこす tàn" }, // 198
                { voca: "腐る", tv: "くさる hủ" }, // 199

            ];

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
