<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="baitap.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>Bài Tập 1-4</h1></div>

        <div class="frame-box">
            <div class="box" id="box">
            
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>


        <script>

            const lesson3 = [
                // まとめ問題（1課～4課）(Câu 1 - 13)
                { cauhoi: "もっと雪が（  ）スキーはできない。",
                    a: "降ってから",
                    b: "降っているうちに",
                    c: "降ってからでないと",
                    d: "降らない間に",
                dapan_d: "降ってからでないと" },

                { cauhoi: "祖父が（  ）、午後になって雨が降ってきた。",
                    a: "言ってから",
                    b: "言ったから",
                    c: "言っていれば",
                    d: "言ったとおり",
                dapan_d: "言ったとおり" },

                { cauhoi: "彼は会う（  ）政治の話をする。",
                    a: "ところで",
                    b: "たびに",
                    c: "うちに",
                    d: "一方で",
                dapan_d: "たびに" },

                { cauhoi: "本屋で読みたい本を（  ）、待ち合わせの時間を過ぎてしまった。",
                    a: "探している間",
                    b: "探しているうちに",
                    c: "探しながら",
                    d: "探してから",
                dapan_d: "探しているうちに" },

                { cauhoi: "リーさんはこの学校に（  ）、一度も欠席しなかった。",
                    a: "留学している間",
                    b: "留学してからでないと",
                    c: "留学しているうちに",
                    d: "留学しているところで",
                dapan_d: "留学している間" },

                { cauhoi: "A「月日がたつのは早いですね。お子さんはもう中学生なんでしょう。」B「いえ、中学生（  ）、もう高校1年なんですよ。」",
                    a: "ではなく",
                    b: "だけでなく",
                    c: "というより",
                    d: "に対して",
                dapan_d: "ではなく" },

                { cauhoi: "A「あ、今度は失敗しないでうまく組み立てられたね。」B「ぼくは同じ間違いを（  ）ばかじゃないよ。」",
                    a: "繰り返すより",
                    b: "繰り返すほど",
                    c: "繰り返さないほど",
                    d: "繰り返さないより",
                dapan_d: "繰り返すほど" },

                { cauhoi: "クレジットカードは便利な（  ）、危険も多い。",
                    a: "場合",
                    b: "結果",
                    c: "反面",
                    d: "割合",
                dapan_d: "反面" },

                { cauhoi: "わたしが子どもの洋服を作るのは、子どもの（  ）、自分の趣味です。",
                    a: "物というより",
                    b: "物のかわりに",
                    c: "ためというより",
                    d: "ためのかわりに",
                dapan_d: "ためというより" },

                { cauhoi: "山田先生が（  ）、川島先生はすぐに怒る。",
                    a: "いつも笑っているのに対して",
                    b: "いつも笑っているのより",
                    c: "あまり笑わないのに対して",
                    d: "あまり笑わないのより",
                dapan_d: "いつも笑っているのに対して" },

                { cauhoi: "連休はどこかに旅行に行く（  ）、家でパーティーをしたい。",
                    a: "というより",
                    b: "反面",
                    c: "うちに",
                    d: "かわりに",
                dapan_d: "かわりに" },

                { cauhoi: "かぜをひいたようだ。こんなときは無理を（  ）。今日は仕事を休もう。",
                    a: "しないようだ",
                    b: "しないに限る",
                    c: "するようではない",
                    d: "するのでもない",
                dapan_d: "しないに限る" },

                { cauhoi: "A「ここから見える景色はいいですねえ。」B「ええ、富士山の姿が（  ）。」",
                    a: "日によっていろいろに変化します",
                    b: "日が変わるたびにきれいです",
                    c: "日が変わるたびにいつも同じです",
                    d: "日によっていつもきれいです",
                dapan_d: "日によっていろいろに変化します" }
            ];

            let a = lesson3.length;
            console.log(a); // 5
            
            let html = "";

            //ramdom
            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }



            for (let i = 1; i <= a; i++) {

                    // Lấy 4 đáp án và random thứ tự
                let dapan = [
                    lesson3[i-1].a,
                    lesson3[i-1].b,
                    lesson3[i-1].c,
                    lesson3[i-1].d
                ];
                dapan.sort(() => Math.random() - 0.5);


                html += `
                    <div class="box-cauhoi${i} box-cauhoi">
                        <div class="cauhoi">
                            ${lesson3[i-1].cauhoi}
                        </div>
                        <div class="dapan">
                            <div class="dapan-up huong">
                                <div class="a item">
                                    ${dapan[0]}
                                </div>
                                <div class="b item">
                                    ${dapan[1]}
                                </div>
                            </div>
                            <div class="dapan-down huong">
                                <div class="c item">
                                    ${dapan[2]}
                                </div>
                                <div class="d item">
                                    ${dapan[3]}
                                </div>
                            </div>
                        </div>
                        <div class="dapan-d">
                            <div class="action${i} action"></div>
                            <div class="action-dapan-d${i} action-dapan-d">${lesson3[i-1].dapan_d}</div>
                        </div>
                    </div>
                `;
            }
            document.getElementById("box").innerHTML = html;




            //sắp xếp lại các card item theo chiều ngang
            const box_cauhoi = document.querySelectorAll(".box-cauhoi");

            box_cauhoi.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".box").style.transform = `translateX(${i_next*(-100)}%)`
                reset_dapan_d();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".box").style.transform = `translateX(${i_next*(-100)}%)`
                reset_dapan_d();
            })

            //check đáp án

            for (let i = 1; i <= a; i++){
                document.querySelector(`.action${i}`).addEventListener("click", function(){
                    document.querySelector(`.action${i}`).style.zIndex = "-1";
                })
                document.querySelector(`.action-dapan-d${i}`).addEventListener("click", function(){
                    document.querySelector(`.action${i}`).style.zIndex = "4";
                })
            }

                
            
            function reset_dapan_d(){
                for (let i = 1; i <= a; i++){
                        document.querySelector(`.action${i}`).style.zIndex = "3";
                }
            }


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })

            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });
            
        </script>
    </body>
</html>
