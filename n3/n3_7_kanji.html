<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 かんじ -350</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

                const lesson3 = [
                    { voca: "暖める", tv: "あたためる noãn" },
                    { voca: "温める", tv: "あたためる ôn" },
                    { voca: "高まる", tv: "たかまる cao" },
                    { voca: "高める", tv: "たかめる cao" },
                    { voca: "強まる", tv: "つよまる cường" },
                    { voca: "強める", tv: "つよめる cường" },
                    { voca: "弱まる", tv: "よわまる nhược" },
                    { voca: "弱める", tv: "よわめる nhược" },
                    { voca: "広まる", tv: "ひろまる quảng" },
                    { voca: "広める", tv: "ひろめる quảng" },
                    { voca: "深まる", tv: "ふかまる thâm" },
                    { voca: "深める", tv: "ふかめる thâm" },
                    { voca: "世話", tv: "せわ thế thoại" },
                    { voca: "家庭", tv: "かてい gia đình" },
                    { voca: "協力", tv: "きょうりょく hiệp lực" },
                    { voca: "感謝", tv: "かんしゃ cảm tạ" },
                    { voca: "(お)礼", tv: "(お)れい lễ" },
                    { voca: "(お)詫び", tv: "(お)わび sá" },
                    { voca: "握手", tv: "あくしゅ ác thủ" },
                    { voca: "意地悪", tv: "いじわる ý địa ác" },
                    { voca: "節約", tv: "せつやく tiết ước" },
                    { voca: "経営", tv: "けいえい kinh doanh" },
                    { voca: "反省", tv: "はんせい phản tỉnh" },
                    { voca: "実行", tv: "じっこう thực hành" },
                    { voca: "進歩", tv: "しんぽ tiến bộ" },
                    { voca: "変化", tv: "へんか biến hóa" },
                    { voca: "発達", tv: "はったつ phát đạt" },
                    { voca: "体力", tv: "たいりょく thể lực" },
                    { voca: "出場", tv: "しゅつじょう xuất trường" },
                    { voca: "活躍", tv: "かつやく hoạt dược" },
                    { voca: "競争", tv: "きょうそう cạnh tranh" },
                    { voca: "応援", tv: "おうえん ứng viện" },
                    { voca: "拍手", tv: "はくしゅ phách thủ" },
                    { voca: "人気", tv: "にんき nhân khí" },
                    { voca: "情報", tv: "じょうほう tình báo" },
                    { voca: "交換", tv: "こうかん giao hoán" },
                    { voca: "流行", tv: "りゅうこう lưu hành" },
                    { voca: "宣伝", tv: "せんでん tuyên truyền" },
                    { voca: "広告", tv: "こうこく quảng cáo" },
                    { voca: "注目", tv: "ちゅうもく chú mục" },
                    { voca: "通訳", tv: "つうやく thông dịch" },
                    { voca: "翻訳", tv: "ほんやく phiên dịch" },
                    { voca: "伝言", tv: "でんごん truyền ngôn" },
                    { voca: "報告", tv: "ほうこく báo cáo" },
                    { voca: "録画", tv: "ろくが lục họa" },
                    { voca: "混雑", tv: "こんざつ hỗn tạp" },
                    { voca: "渋滞", tv: "じゅうたい sáp trệ" },
                    { voca: "衝突", tv: "しょうとつ xung đột" },
                    { voca: "被害", tv: "ひがい bị hại" }
                ];
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
