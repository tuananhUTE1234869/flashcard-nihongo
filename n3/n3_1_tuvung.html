<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 ことば -50</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                { voca: "だんせい", tv: "Nam giới" },
                { voca: "じょせい", tv: "Nữ giới" },
                { voca: "こうれい", tv: "Tuổi cao" },
                { voca: "としうえ", tv: "Lớn tuổi hơn" },
                { voca: "めうえ", tv: "Cấp trên, người trên" },
                { voca: "せんぱい", tv: "Người đi trước" },
                { voca: "こうはい", tv: "Người đi sau" },
                { voca: "じょうし", tv: "Ông chủ, cấp trên" },
                { voca: "あいて", tv: "Đối phương" },
                { voca: "しりあい", tv: "Người quen" },
                { voca: "ゆうじん", tv: "Bạn" },
                { voca: "なか", tv: "Quan hệ" },
                { voca: "せいねんがっぴ", tv: "Ngày tháng năm sinh" },
                { voca: "たんじょう", tv: "Sự ra đời" },
                { voca: "とし", tv: "Năm" },
                { voca: "しゅっしん", tv: "Xuất thân, gốc gác" },
                { voca: "こきょう", tv: "Quê hương" },
                { voca: "せいちょう", tv: "Sinh trưởng, phát triển" },
                { voca: "せいじん", tv: "Người trưởng thành" },
                { voca: "ごうかく", tv: "Thi đỗ, trúng tuyển" },
                { voca: "しんがく", tv: "Học lên" },
                { voca: "たいがく", tv: "Sự bỏ học" },
                { voca: "しゅうしょく", tv: "Sự tìm việc" },
                { voca: "たいしょく", tv: "Nghỉ việc" },
                { voca: "しつぎょう", tv: "Thất nghiệp" },
                { voca: "ざんぎょう", tv: "Làm thêm giờ" },
                { voca: "せいかつ", tv: "Cuộc sống, sinh hoạt" },
                { voca: "つうきん", tv: "Đi làm (đi và về)" },
                { voca: "がくれき", tv: "Bằng cấp, quá trình học tập" },
                { voca: "きゅうりょう", tv: "Tiền lương" },
                { voca: "めんせつ", tv: "Phỏng vấn" },
                { voca: "きゅうけい", tv: "Nghỉ giải lao" },
                { voca: "かんこう", tv: "Tham quan, du lịch" },
                { voca: "きこく", tv: "Về nước" },
                { voca: "きせい", tv: "Về quê" },
                { voca: "きたく", tv: "Về nhà" },
                { voca: "さんか", tv: "Tham gia" },
                { voca: "しゅっせき", tv: "Tham gia, có mặt" },
                { voca: "けっせき", tv: "Vắng mặt" },
                { voca: "ちこく", tv: "Đến muộn" },
                { voca: "けしょう", tv: "Trang điểm" },
                { voca: "けいさん", tv: "Tính toán, thanh toán" },
                { voca: "けいかく", tv: "Kế hoạch" },
                { voca: "せいこう", tv: "Thành công" },
                { voca: "しっぱい", tv: "Thất bại" },
                { voca: "じゅんび", tv: "Chuẩn bị" },
                { voca: "せいり", tv: "Sắp xếp, vứt bỏ" },
                { voca: "ちゅうもん", tv: "Đặt hàng, gọi đồ, yêu cầu" },
                { voca: "ちょきん", tv: "Tiền tiết kiệm, gửi tiền tiết kiệm" },
                { voca: "てつや", tv: "Thức suốt đêm" },
                

                
                ];

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
