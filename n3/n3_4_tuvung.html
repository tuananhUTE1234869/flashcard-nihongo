<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="../style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>N3 ことば -200</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            
                const lesson3 = [
                    { voca: "ことわる", tv: "Từ chối, xin phép" }, 
                    { voca: "みつかる", tv: "Được tìm thấy, bị bắt gặp" }, 
                    { voca: "みつける", tv: "Tìm thấy" }, 
                    { voca: "つかまる", tv: "Bị bắt, nắm, giữ" }, 
                    { voca: "つかまえる", tv: "Bắt, tóm" },
                    { voca: "のる", tv: "Cưỡi, lên" }, 
                    { voca: "のせる", tv: "Chất lên, cho lên" }, 
                    { voca: "おりる", tv: "Xuống, đóng cửa, được chấp nhận" }, // 158[cite: 2]
                    { voca: "おろす", tv: "Cho ai đó xuống (xe), hạ xuống, rút tiền" }, // 159[cite: 3]
                    { voca: "なおる", tv: "Được sửa, cải tiến" }, // 160[cite: 3]
                    { voca: "なおす", tv: "Sửa chữa, chỉnh lại, dịch" }, // 161[cite: 3]
                    { voca: "なおる", tv: "Trở nên tốt hơn, bình phục" }, // 162[cite: 4]
                    { voca: "なおす", tv: "Chữa trị, phục hồi" }, // 163[cite: 4]
                    { voca: "なくなる", tv: "Mất, chết" }, // 164[cite: 4]
                    { voca: "なくす", tv: "Mất (ai đó)" }, // 165[cite: 4]
                    { voca: "うまれる", tv: "Được sinh ra, được tạo ra" }, // 166[cite: 4]
                    { voca: "うむ", tv: "Sinh, tạo ra" }, // 167[cite: 4]
                    { voca: "であう", tv: "Gặp một cách tình cờ" }, // 168[cite: 5]
                    { voca: "たずねる", tv: "Thăm" }, // 169[cite: 5]
                    { voca: "つきあう", tv: "Quan hệ, cùng, hẹn hò" }, // 170[cite: 5]
                    { voca: "きく", tv: "Hiệu quả" }, // 171[cite: 6]
                    { voca: "はやる", tv: "Phổ biến, thịnh hành, lan tràn" }, // 172[cite: 6]
                    { voca: "たつ", tv: "Trải qua, trôi qua" }, // 173[cite: 6]
                    { voca: "まにあう", tv: "Kịp, đúng giờ" }, // 174[cite: 6]
                    { voca: "まにあわせる", tv: "Kịp giờ, kết thúc đúng giờ" }, // 175[cite: 6]
                    { voca: "かよう", tv: "Đi lại thường xuyên, hiểu (cảm giác của ai đó)" }, // 176[cite: 7]
                    { voca: "こむ", tv: "Đông" }, // 177[cite: 7]
                    { voca: "すれちがう", tv: "Vượt qua nhau, lỡ (hụt)" }, // 178[cite: 7]
                    { voca: "かかる", tv: "Được phủ lên, mất thời gian, mắc, gây ra, khởi động (động cơ)" }, // 179[cite: 7]
                    { voca: "かける", tv: "Phủ lên, lấy thời gian của ai đó, bắt đầu, nhân" }, // 180[cite: 8]
                    { voca: "うごく", tv: "Di chuyển, làm việc, hành động" }, // 181[cite: 8]
                    { voca: "うごかす", tv: "Di chuyển, làm việc(máy móc), làm cho hành động" }, // 182[cite: 9]
                    { voca: "はなれる", tv: "Tránh xa, xa nhau" }, // 183[cite: 9]
                    { voca: "はなす", tv: "Di chuyển, tách" }, // 184[cite: 9]
                    { voca: "ぶつかる", tv: "Va chạm, xung đột" }, // 185[cite: 10]
                    { voca: "ぶつける", tv: "Đâm mạnh, đụng vào" }, // 186[cite: 10]
                    { voca: "こぼれる", tv: "Bị tràn, trào (nước mắt)" }, // 187[cite: 10]
                    { voca: "こぼす", tv: "Đổ ra, làm tràn" }, // 188[cite: 10]
                    { voca: "ふく", tv: "Lau, chùi" }, // 189[cite: 10]
                    { voca: "かたづく", tv: "Được dọn dẹp, được hoàn thành, được giải quyết" }, // 190
                    { voca: "かたづける", tv: "Dọn dẹp, hoàn thành, giải quyết" }, // 191
                    { voca: "つつむ", tv: "Bọc, gói" }, // 192
                    { voca: "はる", tv: "Dán, đưa lên, đóng lên" }, // 193
                    { voca: "なくなる", tv: "Bị mất" }, // 194
                    { voca: "なくす", tv: "Làm mất" }, // 195
                    { voca: "たりる", tv: "Đủ" }, // 196
                    { voca: "のこる", tv: "Vẫn còn" }, // 197
                    { voca: "のこす", tv: "Chưa xong (ăn), còn lại, để lại" }, // 198
                    { voca: "くさる", tv: "Thiu, mục nát, thối rữa" }, // 199
                    { voca: "むける", tv: "Bóc, lột ra" } // 200

                ];
                        

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "../home_n3.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
