<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG40</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

           const lesson3  = [

                { voca: "かぞえます", tv: "đếm" },

                { voca: "はかります", tv: "đo (chiều dài, thời gian), cân (trọng lượng), tính (dung tích, số lượng)" },

                { voca: "たしかめます", tv: "xác nhận, kiểm tra" },

                { voca: "あいます", tv: "vừa, hợp" },

                { voca: "サイズがあいます", tv: "kích thước vừa, vừa size" },

                { voca: "しゅっぱつします", tv: "khởi hành, xuất phát" },

                { voca: "とうちゃくします", tv: "đến nơi, tới nơi" },

                { voca: "よう", tv: "say, xỉn" },

                { voca: "バスによいます", tv: "say xe buýt" },

                { voca: "うまくいきます", tv: "thuận lợi, suôn sẻ" },

                { voca: "でます", tv: "xuất hiện" },

                { voca: "もんだいがでます", tv: "xuất hiện câu hỏi" },

                { voca: "そうだんします", tv: "thảo luận, bàn bạc" },

                { voca: "ひつような", tv: "cần thiết, tất yếu" },

                { voca: "てんきよほう", tv: "dự báo thời tiết" },

                { voca: "ぼうねんかい", tv: "tiệc cuối năm, tiệc tất niên" },

                { voca: "しんねんかい", tv: "tiệc tân niên, tiệc đầu năm" },

                { voca: "にじかい", tv: "tiệc tăng hai" },

                { voca: "はっぴょうかい", tv: "buổi phát biểu" },

                { voca: "たいかい", tv: "cuộc thi" },

                { voca: "マラソン", tv: "chạy marathon" },

                { voca: "コンテスト", tv: "cuộc thi" },

                { voca: "おもて", tv: "mặt ngoài, mặt phải" },

                { voca: "うら", tv: "mặt sau, mặt trái" },

                { voca: "まちがい", tv: "(sự) nhầm lẫn, sai" },

                { voca: "きず", tv: "vết trầy xước, vết thương" },

                { voca: "ズボン", tv: "quần dài" },

                { voca: "おとしより", tv: "người già, người cao tuổi" },

                { voca: "ながさ", tv: "chiều dài" },

                { voca: "おもさ", tv: "cân nặng, trọng lượng" },

                { voca: "たかさ", tv: "chiều cao" },

                { voca: "おおきさ", tv: "độ lớn, kích thước" },

                { voca: "~びん", tv: "chuyến bay ~" },

                { voca: "~こ", tv: "~ cái, viên (đơn vị đếm vật nhỏ)" },

                { voca: "~ほん", tv: "~ chai, lon, cây..." },

                { voca: "~はい", tv: "~ chén, ~ ly" },

                { voca: "~センチ", tv: "cm" },

                { voca: "~ミリ", tv: "mm" },

                { voca: "~グラム", tv: "gram" },

                { voca: "~いじょう", tv: "từ mức ~ trở lên" },

                { voca: "~いか", tv: "từ mức ~ trở xuống" },

                { voca: "どうでしょうか", tv: "Như thế nào ạ?" },

                { voca: "テスト", tv: "bài kiểm tra" },

                { voca: "せいせき", tv: "thành tích" },

                { voca: "ところで", tv: "nhân tiện thì" },

                { voca: "いらっしゃる", tv: "đến, tới" },

                { voca: "ようす", tv: "tình trạng, tình hình" },

                { voca: "じけん", tv: "vụ án, sự việc, sự kiện" },

                { voca: "オートバイ", tv: "xe mô-tô" },

                { voca: "ばくだん", tv: "chất nổ" },

                { voca: "つもり", tv: "chồng chất, chất lên, tích lũy" },

                { voca: "うんてんしゅ", tv: "tài xế" },

                { voca: "はなれた", tv: "xa, cách xa" },

                { voca: "きゅうに", tv: "đột nhiên, bỗng nhiên" },

                { voca: "うごかします", tv: "khởi động, chạy" },

                { voca: "いっしょうけんめい", tv: "chăm chỉ, gắng hết sức" },

                { voca: "はんにん", tv: "tội phạm" },

                { voca: "おとこ", tv: "người đàn ông" },

                { voca: "てにいれます", tv: "có được, đoạt được, có trong tay" },

                { voca: "いまでも", tv: "ngày nay, bây giờ cũng" },

            ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
