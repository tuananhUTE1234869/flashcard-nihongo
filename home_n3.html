<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="home_n3.css">
        <style>
            .title > h1 {
                font-size: 50px !important;
                height: 120px !important;
            }

        </style>
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>ことば N3</h1></div>
        <div class="option">
            <div class="tema">Phần luyện tập</div>
            <div class="option-text">
                <div class="tuvung">
                    <div class="menu-tuvung menu">
                        <h5>Từ vựng</h5>
                        <div class="menu-tuvung-lesson">

                        </div>
                    </div>
                </div>
                <div class="kanji">
                    <div class="menu-kanji menu">
                        <h5>Kanji</h5>
                        <div class="menu-kanji-lesson">
 
                        </div>
                    </div>
                    
                </div>
            </div>
            <div class="box-nguphap">
                <div class="nguphap">
                    <div class="menu-nguphap menu">
                        <h5>Ngữ Pháp N3</h5>
                        <div class="menu-nguphap-lesson">

                        </div>
                    </div>
                    
                </div>
                <div class="baitap">
                    <div class="menu-baitap menu">
                        <h5>Bài Tập N3</h5>
                        <div class="menu-baitap-lesson">

                        </div>
                    </div>
                </div>
            </div> 
        </div>  
        
        <div class="home">
            <button onclick="back_trangchu()" class="bt-home">Home</button>
        </div>
        <div class="tema">Phần kiểm tra</div>
        <div class="box-full">
                <button onclick="move_tv_n3()">Test Full TuVung</button>
                <button onclick="move_kj_n3()">Test Full Kanji</button>
                <button onclick="move_np_n3()">Test Full NguPhap</button>
        </div>
        <div class="box-full1">
                <button onclick="move_bt_n3()">Test Full BaiTap</button>
        <script>

            //reset lại biến html và mở từ vựng
            let html = "";

            for(let i = 1; i <= 50; i++){
                html += `<li class="lesson${i}">Lesson ${i}</li>`;
            }

            document.querySelector(".menu-tuvung-lesson").innerHTML = html;

            //reset lại biến html và mở kanju
            html = "";
            for(let i = 1; i <= 50; i++){
                html += `<li class="kanji${i}">Kanji ${i}</li>`;
            }
            document.querySelector(".menu-kanji-lesson").innerHTML = html;


            //reset lại biến html và mở ngữ pháp
            html = "";
            for(let i = 1; i <= 50; i++){
                html += `<li class="nguphap${i}">Ngữ Pháp ${i}</li>`;
            }
            document.querySelector(".menu-nguphap-lesson").innerHTML = html;
            //reset lại biến html và mở bàitap
            html = "";
            for(let i = 1; i <= 50; i++){
                html += `<li class="baitap${i}">Bài Tập ${i}</li>`;
            }
            document.querySelector(".menu-baitap-lesson").innerHTML = html;



            // click mở menu tuvung
            const tuvung = document.querySelector(".menu-tuvung");
            tuvung.addEventListener("click", function(){
                document.querySelector(".menu-tuvung-lesson").style.display="flex";
            })

            // click ra ngoài -> đóng
            document.addEventListener("click", function(e){
                if(!tuvung.contains(e.target)){
                    document.querySelector(".menu-tuvung-lesson").style.display = "none";
                }
            });

            // click mở menu kanji
            const kanji = document.querySelector(".menu-kanji");
            kanji.addEventListener("click", function(){
                document.querySelector(".menu-kanji-lesson").style.display="flex";
            })

            // click ra ngoài -> đóng
            document.addEventListener("click", function(e){
                if(!kanji.contains(e.target)){
                    document.querySelector(".menu-kanji-lesson").style.display = "none";
                }
            });

            // click mở menu nguphap
            const nguphap = document.querySelector(".menu-nguphap");
            nguphap.addEventListener("click", function(){
                document.querySelector(".menu-nguphap-lesson").style.display="flex";
            })

            // click ra ngoài -> đóng
            document.addEventListener("click", function(e){
                if(!nguphap.contains(e.target)){
                    document.querySelector(".menu-nguphap-lesson").style.display = "none";
                }
            });

            // click mở menu nguphap
            const baitap = document.querySelector(".menu-baitap");
            baitap.addEventListener("click", function(){
                document.querySelector(".menu-baitap-lesson").style.display="flex";
            })

            // click ra ngoài -> đóng
            document.addEventListener("click", function(e){
                if(!baitap.contains(e.target)){
                    document.querySelector(".menu-baitap-lesson").style.display = "none";
                }
            });

            // chuyển page

            for (let i = 1; i<= 50 ; i++){
                document.querySelector(`.lesson${i}`).addEventListener("click", function(){
                    window.location.href = `n3/n3_${i}_tuvung.html`;
                })
            }

            for (let i = 1; i<= 50 ; i++){
                document.querySelector(`.kanji${i}`).addEventListener("click", function(){
                window.location.href = `n3/n3_${i}_kanji.html`;
            })
            }

            for (let i = 1; i<= 50 ; i++){
                document.querySelector(`.nguphap${i}`).addEventListener("click", function(){
                window.location.href = `n3/n3_${i}_nguphap.html`;
            })
            }

            for (let i = 1; i<= 50 ; i++){
                document.querySelector(`.baitap${i}`).addEventListener("click", function(){
                window.location.href = `n3/baitap${i}.html`;
            })
            }

            function back_trangchu(){
                window.location.href="index.html";
            }



            function move_tv_n3(){
                window.location.href="n3/lessonfull_tuvungN3.html";
            }
            function move_kj_n3(){
                window.location.href="n3/kanjifullN3.html";
            }
            function move_np_n3(){
                window.location.href="n3/lessonfull_nguphapN3.html";
            }
            function move_bt_n3(){
                window.location.href="n3/baitapfullN3.html";
            }


        </script>

    </body>
</html>
