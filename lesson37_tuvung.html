                </div>
            </div>
        </div>
        <div class="box-button">

            <div class="next bt">Next</div>
        </div>
        <div class="home">

            <button class="bt-reload">Reload</button>
        </div>
        <script>

                { voca: "インスタント", tv: "mỳ ăn liền" },

                { voca: "だれか", tv: "một người nào đó" },
                { voca: "よかったですね。", tv: "May quá!" },
                { voca: "オリンピック", tv: "Olympic, Thế vận hội" },
                { voca: "ワールドカップ", tv: "cúp bóng đá thế giới, World Cup" },
                { voca: "とうだいじ", tv: "chùa Todaiji" },
                { voca: "だいぶつ", tv: "bức tượng Phật lớn, Daibutsu" },
                { voca: "えどじだい", tv: "thời đại Edo" },
                { voca: "ポルトガル", tv: "Bồ Đào Nha" },
                { voca: "サウジアラビア", tv: "Ả Rập Xê-út" },
                { voca: "ロシア", tv: "nước Nga" },
                { voca: "みなさま", tv: "quý vị" },
                { voca: "やけます", tv: "cháy, được nướng chín" },
                { voca: "うちがやけます", tv: "nhà bị cháy" },
                { voca: "そのご", tv: "sau đó" },
                { voca: "せかいいさん", tv: "di sản thế giới" },
                { voca: "～のひとつ", tv: "một trong những ~" },
                { voca: "きんいろ", tv: "màu vàng" },
                { voca: "ほんもの", tv: "đồ thật" },
                { voca: "きん", tv: "(kim loại) vàng" },
                { voca: "キロ", tv: "kilôgam, kilômét" },
                { voca: "うつくしい", tv: "tuyệt đẹp" },
                { voca: "ごうか（な）", tv: "sang trọng, lộng lẫy" },
                { voca: "ちょうこく", tv: "điêu khắc" },
                { voca: "いいつたえ", tv: "truyền thuyết" },
                { voca: "ねむります", tv: "ngủ" },
                { voca: "ほります", tv: "khắc, chạm, tạc" },
                { voca: "なかま", tv: "nhóm bạn bè, đồng nghiệp" },
                { voca: "しかし", tv: "nhưng, tuy nhiên..." },
                { voca: "そのあと", tv: "sau đó" },
                { voca: "いっしょうけんめい", tv: "chăm chỉ, gắng hết sức" },
                { voca: "ねずみ", tv: "chuột" },
                { voca: "いっぴきもいません", tv: "không có một con nào" },
                { voca: "ねむりねこ", tv: "con mèo đang ngủ" },
            ];



            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
