lesson41_tuvung.html<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG44</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [

                { voca: "なきます", tv: "khóc" },

                { voca: "わらいます", tv: "cười" },

                { voca: "ねむります", tv: "ngủ" },

                { voca: "かわきます", tv: "khô" },

                { voca: "シャツがかわきます", tv: "áo khô" },

                { voca: "ぬれます", tv: "ướt" },

                { voca: "シャツがぬれます", tv: "áo bị ướt" },

                { voca: "すべります", tv: "trượt, trơn" },

                { voca: "おきます", tv: "xảy ra" },

                { voca: "じこがおきます", tv: "tai nạn xảy ra" },

                { voca: "ちょうせつします", tv: "điều chỉnh" },

                { voca: "あんぜんな", tv: "an toàn" },

                { voca: "きけんな", tv: "nguy hiểm" },

                { voca: "こい", tv: "đậm (vị)" },

                { voca: "うすい", tv: "nhạt, loãng (vị, màu sắc)" },

                { voca: "あつい", tv: "dày" },

                { voca: "ふとい", tv: "mập, béo, nét đậm, to bản" },

                { voca: "ほそい", tv: "thon dài, mảnh, ốm" },

                { voca: "くうき", tv: "không khí" },

                { voca: "なみだ", tv: "nước mắt" },

                { voca: "わしょく", tv: "món ăn Nhật" },

                { voca: "ようしょく", tv: "món ăn Âu Mỹ, món Tây" },

                { voca: "おかず", tv: "thức ăn (trong bữa cơm)" },

                { voca: "りょう", tv: "số lượng" },

                { voca: "ばい", tv: "gấp ~ lần" },

                { voca: "シングル", tv: "phòng đơn (khách sạn)" },

                { voca: "ツイン", tv: "phòng đôi (khách sạn)" },

                { voca: "せんたくもの", tv: "đồ (cần) giặt" },

                { voca: "ディーブイディー", tv: "DVD" },

                { voca: "ホテルひろしま", tv: "Khách sạn Hiroshima (tên giả định)" },

                { voca: "どうなさいますか", tv: "Bạn muốn làm như thế nào ạ?" },

                { voca: "カット", tv: "cắt (tóc)" },

                { voca: "シャンプー", tv: "dầu gội" },

                { voca: "シャンプーをします", tv: "gội đầu" },

                { voca: "どういうふうになさいますか", tv: "Bạn muốn kiểu như thế nào ạ?" },

                { voca: "ショート", tv: "(cắt) ngắn" },

                { voca: "～みたいにしてください", tv: "Hãy làm / (cắt) giống ~" },

                { voca: "これでよろしいでしょうか", tv: "Thế này được chưa ạ?" },

                { voca: "どうも おつかれさまでした", tv: "Cảm ơn anh/chị" },

                { voca: "いやがります", tv: "ghét, không thích" },

                { voca: "また", tv: "hơn nữa, ngoài ra" },

                { voca: "うまく", tv: "tốt, giỏi" },

                { voca: "じゅんじょ", tv: "trình tự" },

                { voca: "あんしんな", tv: "yên tâm" },

                { voca: "ひょうげん", tv: "cách nói" },

                { voca: "たとえば", tv: "ví dụ, chẳng hạn như" },

                { voca: "わかれます", tv: "chia tay" },

                { voca: "これら", tv: "những từ này" },

                { voca: "えんぎがわるい", tv: "gở, không may" },

            ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
