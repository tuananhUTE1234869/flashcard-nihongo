<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>KANJI48</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>1
        
        <script>
            // tạo thẻ 
            

                
               let lesson3 = [
                { voca: "触るな", tv: "さわるな xúc" },
                { voca: "注意", tv: "ちゅうい chú ý" },
                { voca: "危険", tv: "きけん nguy hiểm" },
                { voca: "止まれ", tv: "とまれ chỉ" },
                { voca: "ポイ捨て禁止", tv: "ポイすてきんし xả cấm chỉ" },
                { voca: "飲食禁止", tv: "いんしょくきんし ẩm thực cấm chỉ" },
                { voca: "撮影禁止", tv: "さつえいきんし tát ảnh cấm chỉ" },
                { voca: "使用禁止", tv: "しようきんし sử dụng cấm chỉ" },
                { voca: "土足厳禁", tv: "どそくげんきん thổ túc nghiêm cấm" },
                { voca: "騒音禁止", tv: "そうおんきんし tao âm cấm chỉ" },
                { voca: "携帯使用禁止", tv: "けいたいしようきんし huề đới sử dụng cấm chỉ" },
                { voca: "駆込危険", tv: "かけこみきけん khu nhập nguy hiểm" },
                { voca: "私語厳禁", tv: "しごげんきん tư ngữ nghiêm cấm" },
                { voca: "足元注意", tv: "あしもとちゅうい túc nguyên chú ý" },
                { voca: "頭上に注意", tv: "ずじょうにちゅうい đầu thượng chú ý" },
                { voca: "立入禁止", tv: "たちいりきんし lập nhập cấm chỉ" },
                { voca: "駐車禁止", tv: "ちゅうしゃきんし trú xa cấm chỉ" },
                { voca: "駐輪禁止", tv: "ちゅうりんきんし trú luân cấm chỉ" },
                { voca: "横断禁止", tv: "おうだんきんし hoành đoạn cấm chỉ" },
                { voca: "進入禁止", tv: "しんにゅうきんし tiến nhập cấm chỉ" },
                { voca: "禁煙", tv: "きんえん cấm yên" }
                ];
                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
