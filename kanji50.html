<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>KANJI50</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>1
        
        <script>
            // tạo thẻ 
            

                let lesson3 = [

                    { voca: "参ります", tv: "まい(ります) tham" },

                    { voca: "おります", tv: "お(ります) cư" },

                    { voca: "頂きます", tv: "いただ(きます) đính" },

                    { voca: "申します", tv: "もう(します) thân" },

                    { voca: "致します", tv: "いた(します) trí" },

                    { voca: "拝見します", tv: "はいけんします bái kiến" },

                    { voca: "存じます", tv: "ぞん(じます) tồn" },

                    { voca: "伺います", tv: "うかが(います) tý" },

                    { voca: "お目にかかります", tv: "おめにかか(ります) mục" },

                    { voca: "入れます", tv: "い(れます) nhập" },

                    { voca: "用意します", tv: "よういします dụng ý" },

                    { voca: "私", tv: "わたくし tư" },

                    { voca: "再来週", tv: "さらいしゅう tái lai chu" },

                    { voca: "再来月", tv: "さらいげつ tái lai nguyệt" },

                    { voca: "再来年", tv: "さらいねん tái lai niên" },

                    { voca: "初めに", tv: "はじめに sơ" },

                    { voca: "江戸東京博物館", tv: "えどとうきょうはくぶつかん giang hộ đông kinh bác vật quán" },

                    { voca: "緊張します", tv: "きんちょうします khẩn trương" },

                    { voca: "賞金", tv: "しょうきん thưởng kim" },

                    { voca: "頃", tv: "ころ khoảnh" },

                    { voca: "叶います", tv: "かな(います) hiệp" },

                    { voca: "夢が叶います", tv: "ゆめがかな(います) mộng hiệp" },

                    { voca: "応援します", tv: "おうえんします ứng viện" },

                    { voca: "心から", tv: "こころから tâm" },

                    { voca: "感謝します", tv: "かんしゃします cảm tạ" },

                    { voca: "お礼", tv: "おれい lễ" },

                    { voca: "お元気でいらっしゃいますか", tv: "おげんきでいらっしゃいますか nguyên khí" },

                    { voca: "迷惑をかけます", tv: "めいわくをか(けます) mê hoặc" },

                    { voca: "生かします", tv: "い(かします) sinh" },

                ];
                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
