lesson41_tuvung.html<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG48</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

           const lesson3 = [

                { voca: "おろします", tv: "bốc dỡ, hạ xuống" },

                { voca: "つみにをおろします", tv: "dỡ hàng xuống" },

                { voca: "おろします", tv: "gỡ xuống" },

                { voca: "かんばんをおろします", tv: "gỡ bảng hiệu xuống" },

                { voca: "とどけます", tv: "giao đến" },

                { voca: "せわをします", tv: "chăm sóc" },

                { voca: "ろくおんします", tv: "ghi âm" },

                { voca: "いやな", tv: "chán, ghét, khó chịu" },

                { voca: "じゅく", tv: "trung tâm học thêm" },

                { voca: "せいと", tv: "học sinh, học trò" },

                { voca: "ファイル", tv: "tập tin, tài liệu" },

                { voca: "じゆうに", tv: "một cách tự do" },

                { voca: "～かん", tv: "trong khoảng thời gian ～" },

                { voca: "とおかかん", tv: "10 ngày" },

                { voca: "いいことですね", tv: "Điều đó hay quá nhỉ!" },

                { voca: "おいそがしいですか", tv: "Bạn có đang bận không?" },

                { voca: "えいぎょう", tv: "kinh doanh" },

                { voca: "それまでに", tv: "trước lúc đó" },

                { voca: "かまいません", tv: "không sao, không phiền" },

                { voca: "たのしみ", tv: "tận hưởng, mong đợi" },

                { voca: "おや", tv: "bố mẹ" },

                { voca: "しょうがくせい", tv: "học sinh tiểu học" },

                { voca: "パーセント", tv: "phần trăm" },

                { voca: "そのつぎ", tv: "tiếp theo đó" },

                { voca: "しゅうじ", tv: "luyện chữ (của học sinh tiểu học)" },

                { voca: "ふつうの～", tv: "~ thông thường, ~ bình thường" },

                { voca: "ふつうのひ", tv: "ngày thường" }

            ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
