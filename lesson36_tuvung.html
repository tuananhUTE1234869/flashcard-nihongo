<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG32</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            let lesson3 = [
                { voca: "あいます", tv: "gặp" },
                { voca: "じこにあいます", tv: "gặp tai nạn" },
                { voca: "ちょきんします", tv: "tiết kiệm tiền, để dành tiền" },
                { voca: "すぎます", tv: "quá, vượt quá" },
                { voca: "しちじをすぎます", tv: "quá 7 giờ" },
                { voca: "なれます", tv: "quen, thích nghi" },
                { voca: "しごとになれます", tv: "quen với công việc" },
                { voca: "くさります", tv: "bị hỏng, bị thiu, bị ôi" },
                { voca: "たべものがくさります", tv: "đồ ăn bị thiu" },
                { voca: "けんどう", tv: "kiếm đạo" },
                { voca: "じゅうどう", tv: "võ Judo, nhu đạo" },
                { voca: "ラッシュ", tv: "giờ cao điểm" },
                { voca: "うちゅう", tv: "vũ trụ" },
                { voca: "きょく", tv: "khúc nhạc, ca khúc" },
                { voca: "まいしゅう", tv: "mỗi tuần" },
                { voca: "まいつき", tv: "mỗi tháng" },
                { voca: "まいとし", tv: "mỗi năm" },
                { voca: "このごろ", tv: "dạo này, thời gian gần đây" },
                { voca: "やっと", tv: "cuối cùng thì cũng, đã" },
                { voca: "かなり", tv: "khá, tương đối" },
                { voca: "かならず", tv: "nhất định, chắc chắn" },
                { voca: "ぜったいに", tv: "tuyệt đối" },
                { voca: "じょうずに", tv: "giỏi, khéo, thành thạo" },
                { voca: "できるだけ", tv: "cố gắng hết sức, trong khả năng có thể" },
                { voca: "ほとんど", tv: "hầu hết, hầu như, phần lớn" },
                { voca: "おきゃくさま", tv: "quý khách" },
                { voca: "とくべつ（な）", tv: "đặc biệt" },
                { voca: "していらっしゃいます", tv: "đang làm (kính ngữ của しています)" },
                { voca: "すいえい", tv: "môn bơi lội" },
                { voca: "ちがいます", tv: "khác nhau, sai" },
                { voca: "つかっていらっしゃるんですね", tv: "đang dùng (kính ngữ)" },
                { voca: "チャレンジします", tv: "thử sức, thử thách" },
                { voca: "きもち", tv: "cảm giác, tâm trạng" },
                { voca: "のりもの", tv: "phương tiện giao thông" },
                { voca: "せいき", tv: "thế kỷ" },
                { voca: "とおく", tv: "nơi xa, ở nơi xa" },
                { voca: "めずらしい", tv: "hiếm, quý hiếm" },
                { voca: "きしゃ", tv: "tàu hỏa (chạy bằng hơi nước)" },
                { voca: "きせん", tv: "tàu thủy (chạy bằng hơi nước)" },
                { voca: "おおぜいの～", tv: "nhiều ~ (người)" },
                { voca: "はこびます", tv: "vận chuyển, khuân" },
                { voca: "りようします", tv: "sử dụng" },
                { voca: "じゆうに", tv: "một cách tự do" }
            ];



            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
