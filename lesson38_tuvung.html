<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG38</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

             const lesson3 = [

                    { voca: "さんかします", tv: "tham gia" },

                    { voca: "りょこうにさんかします", tv: "tham gia du lịch" },

                    { voca: "そだてます", tv: "trồng, chăm sóc" },

                    { voca: "はこびます", tv: "vận chuyển, khuân" },

                    { voca: "にゅういんします", tv: "nhập viện" },

                    { voca: "たいいんします", tv: "xuất viện" },

                    { voca: "いれます", tv: "bật (nút nguồn)" },

                    { voca: "でんげんをいれます", tv: "bật nguồn, mở nguồn" },

                    { voca: "きります", tv: "tắt" },

                    { voca: "でんげんをきります", tv: "tắt điện, tắt nút nguồn" },

                    { voca: "かけます", tv: "khóa lại" },

                    { voca: "かぎをかけます", tv: "bấm ổ khóa lại" },

                    { voca: "はきます", tv: "nôn" },

                    { voca: "うそをつきます", tv: "nói dối" },

                    { voca: "きもちがいい", tv: "tâm trạng thoải mái, dễ chịu" },

                    { voca: "きもちがわるい", tv: "tâm trạng không tốt, khó chịu, buồn nôn" },

                    { voca: "おおきな", tv: "lớn, to" },

                    { voca: "ちいさな", tv: "bé, nhỏ" },

                    { voca: "あかちゃん", tv: "trẻ sơ sinh, em bé" },

                    { voca: "しょうがっこう", tv: "trường cấp 1" },

                    { voca: "ちゅうがっこう", tv: "trường cấp 2" },

                    { voca: "えきまえ", tv: "trước nhà ga" },

                    { voca: "かいがん", tv: "bờ biển" },

                    { voca: "こうじょう", tv: "xưởng, nhà máy" },

                    { voca: "むら", tv: "làng" },

                    { voca: "かな", tv: "chữ Kana" },

                    { voca: "ゆびわ", tv: "chiếc nhẫn" },

                    { voca: "でんげん", tv: "nguồn điện, nút điện nguồn" },

                    { voca: "しゅうかん", tv: "thói quen, tập quán" },

                    { voca: "けんこう", tv: "sức khỏe" },

                    { voca: "～せい", tv: "hàng (sản xuất), sản phẩm của nước ~" },

                    { voca: "おととし", tv: "năm kia" },

                    { voca: "いけない", tv: "không được rồi, việc không may" },

                    { voca: "おさきにしつれいします", tv: "tôi xin phép về trước" },

                    { voca: "かいらん", tv: "việc chuyền nhau xem (thông báo...)" },

                    { voca: "けんきゅうしつ", tv: "phòng nghiên cứu" },

                    { voca: "きちんと", tv: "ngay ngắn, chỉnh chu, cẩn thận" },

                    { voca: "せいりします", tv: "sắp xếp gọn" },

                    { voca: "ほうほう", tv: "phương pháp" },

                    { voca: "～という", tv: "có tên gọi là ~" },

                    { voca: "～さつ", tv: "quyển, cuốn (đếm sách...)" },

                    { voca: "はんこ", tv: "con dấu, triện" },

                    { voca: "おします", tv: "ấn, đẩy, bấm, xô, đóng" },

                    { voca: "はんこをおします", tv: "đóng dấu (thay cho ký tên)" },

                    { voca: "ふたご", tv: "cặp sinh đôi" },

                    { voca: "しまい", tv: "chị em" },

                    { voca: "ごねんせい", tv: "học sinh năm thứ 5" },

                    { voca: "にています", tv: "giống nhau (hình dáng)" },

                    { voca: "せいかく", tv: "tính cách" },

                    { voca: "おとなしい", tv: "trầm tĩnh, ngoan ngoãn" },

                    { voca: "やさしい", tv: "hiền lành, dịu dàng, chăm sóc" },

                    { voca: "せわをします", tv: "chăm sóc" },

                    { voca: "じかんがたちます", tv: "thời gian trôi qua" },

                    { voca: "だいすき（な）", tv: "rất thích, ham thích" },

                    { voca: "てん", tv: "điểm" },

                    { voca: "きがつよい", tv: "cứng cỏi, kiên quyết" },

                    { voca: "けんかします", tv: "cãi nhau, đánh nhau" },

                    { voca: "ふしぎ（な）", tv: "kỳ lạ, ảo diệu" },

                    { voca: "ねんれい", tv: "tuổi tác, độ tuổi" },

                    { voca: "しかた", tv: "cách làm" },

                ];




            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
