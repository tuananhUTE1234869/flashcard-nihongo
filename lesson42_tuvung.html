    <body>

        </div>
        <div class="home">
            <button class="bt-home">Home</button>

        <script>
            // tạo thẻ 
            

           const lesson3 = [

                { voca: "きょういく", tv: "giáo dục" },

                { voca: "ぶんか", tv: "văn hóa" },

                { voca: "しゃかい", tv: "xã hội" },

                { voca: "せいじ", tv: "chính trị" },

                { voca: "ほうりつ", tv: "pháp luật" },

                { voca: "せんそう", tv: "chiến tranh" },

                { voca: "へいわ", tv: "hòa bình" },

                { voca: "もくてき", tv: "mục đích" },

                { voca: "ろんぶん", tv: "bài luận văn" },

                { voca: "たのしみ", tv: "niềm vui, sự háo hức" },

                { voca: "ミキサー", tv: "máy xay sinh tố" },

                { voca: "やかん", tv: "cái ấm đun nước" },

                { voca: "ふた", tv: "cái nắp" },

                { voca: "せんぬき", tv: "cái khui nắp chai" },

                { voca: "かんきり", tv: "cái mở đồ hộp" },

                { voca: "かんづめ", tv: "đồ hộp, thực phẩm đóng hộp" },

                { voca: "のしぶくろ", tv: "phong bì bỏ tiền mừng, bao lì xì" },

                { voca: "ふろしき", tv: "Furoshiki, khăn vuông để gói đồ kiểu Nhật" },

                { voca: "そろばん", tv: "bàn tính gảy" },

                { voca: "たいおんけい", tv: "nhiệt kế" },

                { voca: "ざいりょう", tv: "vật liệu, nguyên liệu" },

                { voca: "ある〜", tv: "một ~ nọ" },

                { voca: "あるひ", tv: "một ngày nọ" },

                { voca: "いっしょうけんめい", tv: "cố gắng hết sức, chăm chỉ" },

                { voca: "なぜ", tv: "tại sao" },

                { voca: "どのくらい", tv: "bao lâu" },

                { voca: "こくれん", tv: "Liên Hợp Quốc" },

                { voca: "エリーゼのために", tv: "Dành cho Elise (tên bản nhạc)" },

                { voca: "ベートーベン", tv: "Beethoven" },

                { voca: "こどもニュース", tv: "bản tin thiếu nhi" },

                { voca: "でる", tv: "có, được chi trả" },

                { voca: "ボーナスがでる", tv: "được chi thưởng" },

                { voca: "はんぶん", tv: "một nửa" },

                { voca: "ローン", tv: "tiền vay ngân hàng, khoản nợ ngân hàng" },

                { voca: "カップめん", tv: "mì ly" },

                { voca: "せかいはつ", tv: "đầu tiên trên thế giới" },

                { voca: "〜によって", tv: "bởi ~, do ~" },

                { voca: "どんぶり", tv: "cái tô" },

                { voca: "めん", tv: "mì (soba, udon...)" },

                { voca: "ひろめる", tv: "mở rộng, nhân rộng" },

                { voca: "しじょうちょうさ", tv: "điều tra thị trường" },

                { voca: "わる", tv: "(phân) chia" },

                { voca: "そそぐ", tv: "đổ vào, rót vào" },

                { voca: "チキンラーメン", tv: "tên của một loại mì ăn liền" },

                { voca: "あんどうももふく", tv: "Ando Momofuku (1910-2007)" },

            ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
