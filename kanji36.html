<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>KANJI36</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>1
        
        <script>
            // tạo thẻ 
            

          const lesson3 = [

            { voca: "遭う", tv: "あ(う) tao" },

            { voca: "事故", tv: "じこにあ(う) sự-cố" },

            { voca: "貯金する", tv: "ちょきんする trữ-kim" },

            { voca: "過ぎる", tv: "す(ぎる) quá" },

            { voca: "慣れる", tv: "な(れる) quán" },

            { voca: "仕事", tv: "しごとにな(れる) sĩ-sự" },

            { voca: "腐る", tv: "くさ(る) hủ" },

            { voca: "剣道", tv: "けんどう kiếm-đạo" },

            { voca: "柔道", tv: "じゅうどう nhu-đạo" },

            { voca: "宇宙", tv: "うちゅう vũ-trụ" },

            { voca: "曲", tv: "きょく khúc" },

            { voca: "毎週", tv: "まいしゅう mỗi-chu" },

            { voca: "毎月", tv: "まいつき mỗi-nguyệt" },

            { voca: "毎年", tv: "まいとし mỗi-niên" },

            { voca: "必ず", tv: "かなら(ず) tất" },

            { voca: "絶対", tv: "ぜったいに tuyệt-đối" },

            { voca: "上手", tv: "じょうずに thượng-thủ" },

            { voca: "お客様", tv: "おきゃくさま khách-dạng" },

            { voca: "特別", tv: "とくべつ đặc-biệt" },

            { voca: "水泳", tv: "すいえい thủy-vịnh" },

            { voca: "違う", tv: "ちが(う) vi" },

            { voca: "使う", tv: "つか(う) sử" },

            { voca: "気持ち", tv: "きもち khí-trì" },

            { voca: "乗り物", tv: "の(り)もの vật" },

            { voca: "世紀", tv: "せいき thế-kỉ" },

            { voca: "遠く", tv: "とお(く) viễn" },

            { voca: "珍しい", tv: "めずら(しい) trân" },

            { voca: "汽車", tv: "きしゃ khí-xa" },

            { voca: "汽船", tv: "きせん khí-thuyền" },

            { voca: "大勢", tv: "おおぜい đại-thế" },

            { voca: "運ぶ", tv: "はこ(ぶ) vận" },

            { voca: "利用する", tv: "りようする lợi-dụng" },

            { voca: "自由", tv: "じゆうに tự-do" }

        ];




                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
