<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>KANJI44</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>1
        
        <script>
            // tạo thẻ 
            

        let lesson3 = [

            { voca: "泣く", tv: "な(く) khấp" },

            { voca: "笑う", tv: "わら(う) tiếu" },

            { voca: "眠る", tv: "ねむ(る) miên" },

            { voca: "乾く", tv: "かわ(く) can" },


            { voca: "濡れる", tv: "ぬ(れる) nhu" },


            { voca: "滑る", tv: "すべ(る) cốt" },

            { voca: "起きる", tv: "お(きる) khởi" },

            { voca: "事故が起きる", tv: "じこがお(きる) sự cố, khởi" },

            { voca: "調節する", tv: "ちょうせつする điều tiết" },

            { voca: "安全な", tv: "あんぜん(な) an toàn" },

            { voca: "危険な", tv: "きけん(な) nguy hiểm" },

            { voca: "濃い", tv: "こ(い) nồng" },

            { voca: "薄い", tv: "うす(い) bạc" },

            { voca: "厚い", tv: "あつ(い) hậu" },

            { voca: "太い", tv: "ふと(い) thái" },

            { voca: "細い", tv: "ほそ(い) tế" },

            { voca: "空気", tv: "くうき không khí" },

            { voca: "涙", tv: "なみだ lệ" },

            { voca: "和食", tv: "わしょく hòa thực" },

            { voca: "洋食", tv: "ようしょく dương thực" },

            { voca: "量", tv: "りょう lượng" },

            { voca: "倍", tv: "ばい bội" },

            { voca: "洗濯物", tv: "せんたくもの tẩy trạc vật" },

            { voca: "ホテル広島", tv: "ホテルひろしま quảng đảo" },

            { voca: "お疲れ様でした", tv: "おつかれさまでした bì dạng" },

            { voca: "嫌がる", tv: "いやが(る) hiềm" },

            { voca: "順序", tv: "じゅんじょ thuận tự" },

            { voca: "安心な", tv: "あんしん(な) an tâm" },

            { voca: "表現", tv: "ひょうげん biểu hiện" },

            { voca: "例えば", tv: "たと(えば) lệ" },

            { voca: "別れる", tv: "わか(れる) biệt" },

            { voca: "縁起が悪い", tv: "えんぎがわる(い) duyên khởi, ác" },

        ];


                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
