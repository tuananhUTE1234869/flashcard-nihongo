lesson41_tuvung.html<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG45</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [

                { voca: "しんじます", tv: "tin tưởng, tin" },

                { voca: "キャンセルします", tv: "hủy, hủy bỏ" },

                { voca: "しらせます", tv: "thông báo" },

                { voca: "ほしょうしょ", tv: "phiếu bảo hành" },

                { voca: "りょうしゅうしょ", tv: "hóa đơn" },

                { voca: "キャンプ", tv: "cắm trại" },

                { voca: "ちゅうしします", tv: "dừng, đình chỉ" },

                { voca: "てん", tv: "điểm" },

                { voca: "うめ", tv: "hoa mơ" },

                { voca: "１１０ばん", tv: "số 110 (gọi cảnh sát)" },

                { voca: "１１９ばん", tv: "số 119 (gọi cứu hỏa)" },

                { voca: "きゅうに", tv: "đột nhiên, đột ngột" },

                { voca: "むりに", tv: "cố/làm quá sức" },

                { voca: "たのしみにしています", tv: "đang háo hức chờ đợi" },

                { voca: "いじょうです", tv: "xin hết" },

                { voca: "かかりいん", tv: "người phụ trách" },

                { voca: "コース", tv: "đường chạy (marathon)" },

                { voca: "スタート", tv: "xuất phát, bắt đầu" },

                { voca: "〜い", tv: "hạng ~, thứ ~" },

                { voca: "ゆうしょうします", tv: "đạt giải Nhất" },

                { voca: "なやみ", tv: "điều phiền não" },

                { voca: "めざましどけい", tv: "đồng hồ báo thức" },

                { voca: "めがさめます", tv: "thức giấc, tỉnh giấc" },

                { voca: "だいがくせい", tv: "sinh viên" },

                { voca: "かいとう", tv: "đáp án, câu trả lời" },

                { voca: "かいとうします", tv: "đưa ra câu trả lời" },

                { voca: "なります", tv: "kêu, reo, hót" },

                { voca: "セットします", tv: "cài đặt" },

                { voca: "それでも", tv: "dù cho như vậy" }

            ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
