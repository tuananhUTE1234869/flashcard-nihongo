lesson41_tuvung.html<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG46</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [

                { voca: "わたす", tv: "đưa cho, trao cho" },

                { voca: "ははにかぎをわたす", tv: "đưa chìa khóa cho mẹ tôi" },

                { voca: "かえってくる", tv: "quay về" },

                { voca: "でる", tv: "khởi hành, xuất phát" },

                { voca: "バスがでる", tv: "xe buýt khởi hành" },

                { voca: "とどく", tv: "được giao đến" },

                { voca: "にもつがとどく", tv: "hàng được giao đến" },

                { voca: "にゅうがくする", tv: "nhập học" },

                { voca: "だいがくににゅうがくする", tv: "vào đại học" },

                { voca: "そつぎょうする", tv: "tốt nghiệp" },

                { voca: "だいがくをそつぎょうする", tv: "tốt nghiệp đại học" },

                { voca: "やく", tv: "nướng" },

                { voca: "にくをやく", tv: "nướng thịt" },

                { voca: "やける", tv: "(được) nướng chín" },

                { voca: "にくがやける", tv: "thịt được nướng chín" },

                { voca: "るす", tv: "vắng nhà" },

                { voca: "たくはいびん", tv: "dịch vụ giao hàng tận nhà" },

                { voca: "げんいん", tv: "nguyên nhân" },

                { voca: "こちら", tv: "ở đây, chỗ (chúng) tôi" },

                { voca: "〜のところ", tv: "chỗ ~" },

                { voca: "はんとし", tv: "nửa năm" },

                { voca: "ちょうど", tv: "vừa đúng, ...đúng" },

                { voca: "ちょうど8じ", tv: "8 giờ đúng" },

                { voca: "たったいま", tv: "vừa mới... (tức thì)" },

                { voca: "いま、いいですか", tv: "bây giờ có tiện (để nói chuyện) không?" },

                { voca: "ガスサービスセンター", tv: "trung tâm dịch vụ cung cấp ga" },

                { voca: "ガスレンジ", tv: "bếp ga" },

                { voca: "ぐあい", tv: "tình trạng" },

                { voca: "もうしわけありません", tv: "thành thật xin lỗi" },

                { voca: "どちらさまでしょうか", tv: "xin cho biết quý danh?" },

                { voca: "おまたせしました", tv: "xin lỗi đã để bạn chờ lâu" },

                { voca: "むかう", tv: "đang đi đến" },

                { voca: "ついている", tv: "may mắn" },

                { voca: "ゆか", tv: "nền nhà" },

                { voca: "ころぶ", tv: "ngã, té" },

                { voca: "ベル", tv: "cái chuông" },

                { voca: "なる", tv: "kêu, reo" },

                { voca: "あわてる", tv: "hốt hoảng" },

                { voca: "じゅんばんに", tv: "theo thứ tự" },

                { voca: "できごと", tv: "sự việc" }

            ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
