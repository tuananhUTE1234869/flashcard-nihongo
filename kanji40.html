<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">

    <body>
        <div class="title"><h1>KANJI40</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>1
        
        <script>
            // tạo thẻ 
            

        let lesson3 = [

            { voca: "数える", tv: "かぞ(える) sổ" },

            { voca: "測る", tv: "はか(る) trắc" },

            { voca: "計る", tv: "はか(る) kế" },

            { voca: "量る", tv: "はか(る) lượng" },

            { voca: "確かめる", tv: "たしか(める) xác" },

            { voca: "合う", tv: "あ(う) hợp" },

            { voca: "サイズが合う", tv: "サイズがあ(う) hợp" },

            { voca: "出発する", tv: "しゅっぱつする xuất phát" },

            { voca: "到着する", tv: "とうちゃくする đáo trước" },

            { voca: "酔う", tv: "よ(う) túy" },

            { voca: "バスに酔う", tv: "バスによ(う) túy" },

            { voca: "出る", tv: "で(る) xuất" },

            { voca: "問題が出る", tv: "もんだいがで(る) vấn đề xuất" },

            { voca: "相談する", tv: "そうだんする tương đàm" },

            { voca: "必要な", tv: "ひつような tất yếu" },

            { voca: "天気予報", tv: "てんきよほう thiên khí dự báo" },

            { voca: "忘年会", tv: "ぼうねんかい vong niên hội" },

            { voca: "新年会", tv: "しんねんかい tân niên hội" },

            { voca: "二次会", tv: "にじかい nhị thứ hội" },

            { voca: "発表会", tv: "はっぴょうかい phát biểu hội" },

            { voca: "大会", tv: "たいかい đại hội" },

            { voca: "表", tv: "おもて biểu" },

            { voca: "裏", tv: "うら lý" },

            { voca: "間違い", tv: "まちがい gian vi" },

            { voca: "傷", tv: "きず thương" },

            { voca: "お年寄り", tv: "おとしより niên dữ" },

            { voca: "長さ", tv: "ながさ trường" },

            { voca: "重さ", tv: "おもさ trọng" },

            { voca: "高さ", tv: "たかさ cao" },

            { voca: "大きさ", tv: "おおきさ đại" },

            { voca: "～便", tv: "～びん tiện" },

            { voca: "～個", tv: "～こ cá" },

            { voca: "～本", tv: "～ほん bản" },

            { voca: "～杯", tv: "～はい bôi" },

            { voca: "～以上", tv: "～いじょう dĩ thượng" },

            { voca: "～以下", tv: "～いか dĩ hạ" },

            { voca: "成績", tv: "せいせき thành tích" },

            { voca: "様子", tv: "ようす dạng tử" },

            { voca: "事件", tv: "じけん sự kiện" },

            { voca: "爆弾", tv: "ばくだん bộc đạn" },

            { voca: "積む", tv: "つ(む) tích" },

            { voca: "運転手", tv: "うんてんしゅ vận chuyển thủ" },

            { voca: "離れた", tv: "はな(れた) ly" },

            { voca: "急に", tv: "きゅうに cấp" },

            { voca: "動かす", tv: "うご(かす) động" },

            { voca: "一生懸命", tv: "いっしょうけんめい nhất sinh huyền mệnh" },

            { voca: "犯人", tv: "はんにん phạm nhân" },

            { voca: "男", tv: "おとこ nam" },

            { voca: "手に入れる", tv: "てにい(れる) thủ nhập" },

            { voca: "今でも", tv: "いまでも kim" },

        ];


                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
