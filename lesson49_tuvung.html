lesson41_tuvung.html<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG49</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

           const lesson3= [

            { voca: "りようする", tv: "sử dụng" },

            { voca: "つとめる", tv: "đi làm, làm việc (ở công ty...)" },

            { voca: "かいしゃにつとめる", tv: "làm cho công ty" },

            { voca: "かける", tv: "ngồi" },

            { voca: "いすにかける", tv: "ngồi xuống ghế" },

            { voca: "すごす", tv: "trải qua, sống" },

            { voca: "いらっしゃる", tv: "đi, đến, có (kính ngữ của 行く・来る・いる)" },

            { voca: "めしあがる", tv: "ăn, uống (kính ngữ của 食べる・飲む)" },

            { voca: "おっしゃる", tv: "nói (kính ngữ của 言う)" },

            { voca: "なさる", tv: "làm (kính ngữ của する)" },

            { voca: "ごらんになる", tv: "nhìn, xem (kính ngữ của 見る)" },

            { voca: "ごぞんじです", tv: "biết (kính ngữ của 知っている)" },

            { voca: "あいさつ", tv: "chào hỏi, lời chào" },

            { voca: "あいさつをする", tv: "chào hỏi" },

            { voca: "りょかん", tv: "khách sạn kiểu Nhật" },

            { voca: "バスてい", tv: "trạm xe buýt" },

            { voca: "おくさま", tv: "vợ của người khác (kính ngữ của おくさん)" },

            { voca: "～さま", tv: "ông, bà, anh, chị... (kính ngữ của ～さん)" },

            { voca: "たまに", tv: "đôi khi" },

            { voca: "どなたでも", tv: "dù là ai đi chăng nữa" },

            { voca: "～といいます", tv: "tên là ～" },

            { voca: "～ねん～くみ", tv: "lớp ～ năm ～ (cách gọi tên lớp)" },

            { voca: "5ねん2くみ", tv: "lớp 5.2" },

            { voca: "だす", tv: "phát ra, tỏa ra" },

            { voca: "ねつをだす", tv: "phát sốt" },

            { voca: "よろしくおつたえください", tv: "Tôi xin chuyển lời nhắn giúp tôi." },

            { voca: "しつれいいたします", tv: "Tôi xin phép. (Khi cúp điện thoại)" },


            { voca: "けいれき", tv: "lý lịch, quá trình làm việc" },

            { voca: "いがくぶ", tv: "khoa Y" },

            { voca: "めざす", tv: "nhắm đến, hướng đến" },

            { voca: "すすむ", tv: "tiến bộ, tiến triển, học lên" },

            { voca: "IPSさいぼう", tv: "tế bào IPS" },

            { voca: "かいはつする", tv: "phát triển" },

            { voca: "マウス", tv: "chuột vi tính" },

            { voca: "ヒト", tv: "người" },

            { voca: "じゅしょうする", tv: "nhận giải" },

            { voca: "こうえんかい", tv: "buổi diễn thuyết" },


        ];

            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
