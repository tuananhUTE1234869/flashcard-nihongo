<html>
    <head>
        <meta charset="UTF-8">

    <body>
        <div class="title"><h1>KANJI38</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
    
        <script>
            // tạo thẻ

            { voca: "切る", tv: "き(る) thiết" },

            { voca: "掛ける", tv: "か(ける) quải" },

            { voca: "鍵を掛ける", tv: "かぎをか(ける) kiện quải" },

            { voca: "吐く", tv: "は(く) thổ" },

            { voca: "嘘を吐く", tv: "うそをつ(く) hư thổ" },

            { voca: "気持ちがいい", tv: "きもちがいい khí trì" },

            { voca: "気持ちが悪い", tv: "きもちがわる(い) khí trì ác" },

            { voca: "大きな", tv: "おお(きな) đại" },

            { voca: "小さな", tv: "ちい(さな) tiểu" },

            { voca: "赤ちゃん", tv: "あかちゃん xích" },

            { voca: "小学校", tv: "しょうがっこう tiểu học hiệu" },

            { voca: "中学校", tv: "ちゅうがっこう trung học hiệu" },

            { voca: "駅前", tv: "えきまえ dịch tiền" },

            { voca: "海岸", tv: "かいがん hải ngạn" },

            { voca: "工場", tv: "こうじょう công trường" },

            { voca: "村", tv: "むら thôn" },

            { voca: "仮名", tv: "かな giả danh" },

            { voca: "指輪", tv: "ゆびわ chỉ luân" },

            { voca: "電源", tv: "でんげん điện nguyên" },

            { voca: "習慣", tv: "しゅうかん tập quán" },

            { voca: "健康", tv: "けんこう kiện khang" },

            { voca: "～製", tv: "～せい chế" },

            { voca: "一昨年", tv: "おととし nhất tác niên" },

            { voca: "お先に失礼します", tv: "おさきにしつれいします tiên thất lễ" },

            { voca: "原爆ドーム", tv: "げんばくドーム nguyên bạo" },

            { voca: "出雲大社", tv: "いずもたいしゃ xuất vân đại xã" },

            { voca: "回覧", tv: "かいらん hồi lãm" },

            { voca: "研究室", tv: "けんきゅうしつ nghiên cứu thất" },

            { voca: "整理する", tv: "せいり(する) chỉnh lý" },

            { voca: "方法", tv: "ほうほう phương pháp" },

            { voca: "～冊", tv: "～さつ sách" },

            { voca: "押す", tv: "お(す) áp" },

            { voca: "はんこを押す", tv: "はんこをお(す) áp" },

            { voca: "双子", tv: "ふたご song tử" },

            { voca: "姉妹", tv: "しまい tỉ muội" },

            { voca: "五年生", tv: "ごねんせい ngũ niên sinh" },

            { voca: "似ている", tv: "に(ている) tự" },

            { voca: "性格", tv: "せいかく tính cách" },

            { voca: "大人しい", tv: "おとな(しい) đại nhân" },

            { voca: "優しい", tv: "やさ(しい) ưu" },

            { voca: "世話をする", tv: "せわをする thế thoại" },

            { voca: "時間が経つ", tv: "じかんがた(つ) thời gian kinh" },

            { voca: "大好き（な）", tv: "だいす(き) đại hảo" },

            { voca: "点", tv: "てん điểm" },

            { voca: "気が強い", tv: "きがつよ(い) khí cường" },

            { voca: "喧嘩する", tv: "けんか(する) huyên hoa" },

            { voca: "不思議（な）", tv: "ふしぎ(な) bất tư nghị" },

            { voca: "年齢", tv: "ねんれい niên linh" },

            { voca: "仕方", tv: "しかた sĩ phương" },

        ];


                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
