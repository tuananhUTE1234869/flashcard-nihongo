<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>KANJI34</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>1
        
        <script>
            // tạo thẻ 
            

           let lesson3 = [

                { voca: "磨きます", tv: "みが(きます) ma" },

                { voca: "歯を磨きます", tv: "はをみが(きます) xỉ, ma" },

                { voca: "靴を磨きます", tv: "くつをみが(きます) ngoa, ma" },

                { voca: "組み立てます", tv: "くみた(てます) tổ, lập" },

                { voca: "折ります", tv: "お(ります) chiết" },

                { voca: "気がつきます", tv: "きがつ(きます) khí" },

                { voca: "忘れ物に気が付きます", tv: "わすれものにきがつ(きます) vong, vật, khí" },

                { voca: "醤油をつけます", tv: "しょうゆをつけ(ます) tương, du" },

                { voca: "見つかります", tv: "み(つかります) kiến" },

                { voca: "鍵が見つかります", tv: "かぎがみ(つかります) kiện, kiến" },

                { voca: "質問します", tv: "しつもんします chất, vấn" },

                { voca: "傘を差します", tv: "かさをさ(します) tản, sai" },

                { voca: "お城", tv: "おしろ thành" },

                { voca: "説明書", tv: "せつめいしょ thuyết, minh, thư" },

                { voca: "図", tv: "ず đồ" },

                { voca: "線", tv: "せん tuyến" },

                { voca: "矢印", tv: "やじるし thỉ, ấn" },

                { voca: "黒", tv: "くろ hắc" },

                { voca: "白", tv: "しろ bạch" },

                { voca: "赤", tv: "あか xích" },

                { voca: "青", tv: "あお thanh" },

                { voca: "紺", tv: "こん cám" },

                { voca: "黄色", tv: "きいろ hoàng, sắc" },

                { voca: "茶色", tv: "ちゃいろ trà, sắc" },

                { voca: "醤油", tv: "しょうゆ tương, du" },

                { voca: "お客さん", tv: "おきゃくさん khách" },

                { voca: "夕べ", tv: "ゆうべ tịch" },

                { voca: "茶道", tv: "さどう／ちゃどう trà, đạo" },

                { voca: "お茶を立てます", tv: "おちゃをた(てます) trà" },

                { voca: "先に", tv: "さきに tiên" },

                { voca: "先に帰ります", tv: "さきにかえ(ります) tiên, quy" },

                { voca: "載せます", tv: "の(せます) tải" },

                { voca: "苦い", tv: "にが(い) khổ" },

                { voca: "親子どんぶり", tv: "おやこどんぶり thân, tử" },

                { voca: "材料", tv: "ざいりょう tài, liệu" },

                { voca: "～分", tv: "～ぶん phân" },

                { voca: "～個", tv: "～こ cá" },

                { voca: "玉ねぎ", tv: "たまねぎ ngọc" },

                { voca: "4分の1", tv: "よんぶんのいち phân" },

                { voca: "調味料", tv: "ちょうみりょう điều, vị, liệu" },

                { voca: "適当な大きさ", tv: "てきとうなおおきさ thích, đương, đại" },

                { voca: "鍋", tv: "なべ oa" },

                { voca: "火", tv: "ひ hỏa" },

                { voca: "火に掛けます", tv: "ひにか(けます) hỏa, quải" },

                { voca: "煮ます", tv: "に(ます) chử" },

                { voca: "煮えます", tv: "に(えます) chử" },

                { voca: "経ちます", tv: "た(ちます) kinh" },

                { voca: "時間が経ちます", tv: "じかんがた(ちます) thời, gian, kinh" },

            ];



                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
