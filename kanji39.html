<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <div class="title"><h1>KANJI39</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>1
        
        <script>
            // tạo thẻ 
            

         let lesson3 = [

            { voca: "答", tv: "こた(えます) đáp" },

            { voca: "質問", tv: "しつもん chất-vấn" },

            { voca: "倒", tv: "たお(れます) đảo" },

            { voca: "通", tv: "とお(ります) thông" },

            { voca: "道", tv: "みち đạo" },

            { voca: "死", tv: "し(にます) tử" },

            { voca: "安心", tv: "あんしん an-tâm" },

            { voca: "喧嘩", tv: "けんか huyên-hoa" },

            { voca: "離婚", tv: "りこん ly-hôn" },

            { voca: "太", tv: "ふと(ります) thái" },

            { voca: "痩", tv: "やせます sấu" },

            { voca: "複雑", tv: "ふくざつ phức-tạp" },

            { voca: "邪魔", tv: "じゃま tà-ma" },

            { voca: "硬", tv: "かた(い) ngạnh" },

            { voca: "軟", tv: "やわ(らかい) nhuyễn" },

            { voca: "汚", tv: "きたな(い) ô" },

            { voca: "嬉", tv: "うれ(しい) hỉ" },

            { voca: "悲", tv: "かな(しい) bi" },

            { voca: "恥", tv: "は(ずかしい) sỉ" },

            { voca: "首相", tv: "しゅしょう thủ-tướng" },

            { voca: "地震", tv: "じしん địa-chấn" },

            { voca: "津波", tv: "つなみ tân-ba" },

            { voca: "台風", tv: "たいふう đài-phong" },

            { voca: "雷", tv: "かみなり lôi" },

            { voca: "火事", tv: "かじ hỏa-sự" },

            { voca: "事故", tv: "じこ sự-cố" },

            { voca: "見合", tv: "みあ(い) kiến-hợp" },

            { voca: "操作", tv: "そうさ thao-tác" },

            { voca: "会場", tv: "かいじょう hội-trường" },

            { voca: "代", tv: "だい đại" },

            { voca: "屋", tv: "や ốc" },

            { voca: "号室", tv: "ごうしつ hiệu-thất" },

            { voca: "石鹸", tv: "せっけん thạch-kiềm" },

            { voca: "大勢", tv: "おおぜい đại-thế" },

            { voca: "疲", tv: "つか(れます) bì" },

            { voca: "伺", tv: "うかが(います) tứ" },

            { voca: "途中", tv: "とちゅう đồ-trung" },

            { voca: "大人", tv: "おとな đại-nhân" },

            { voca: "洋服", tv: "ようふく dương-phục" },

            { voca: "西洋化", tv: "せいようか tây-dương-hóa" },

            { voca: "合", tv: "あ(います) hợp" },

            { voca: "今", tv: "いま kim" },

            { voca: "成人式", tv: "せいじんしき thành-nhân-thức" },

            { voca: "伝統的", tv: "でんとうてき truyền-thống-đích" },

        ];


                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
