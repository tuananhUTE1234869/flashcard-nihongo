<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG34</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

               const lesson3 = [

                    { voca: "みがきます", tv: "đánh, chải, mài" },

                    { voca: "はをみがきます", tv: "đánh răng" },

                    { voca: "くつをみがきます", tv: "đánh giày" },

                    { voca: "くみたてます", tv: "lắp ráp" },

                    { voca: "おれます", tv: "gập, bẻ, xếp, gấp lại" },

                    { voca: "きがつきます", tv: "nhận ra, phát hiện ra" },

                    { voca: "わすれものにきがつきます", tv: "nhận ra việc để quên đồ" },

                    { voca: "つけます", tv: "chấm" },

                    { voca: "しょうゆをつけます", tv: "chấm nước tương" },

                    { voca: "みつかります", tv: "được tìm thấy" },

                    { voca: "かぎがみつかります", tv: "chìa khóa được tìm thấy" },

                    { voca: "しつもんします", tv: "hỏi, đặt câu hỏi" },

                    { voca: "さします", tv: "che" },

                    { voca: "かさをさします", tv: "che dù" },

                    { voca: "スポーツクラブ", tv: "câu lạc bộ thể thao" },

                    { voca: "おしろ", tv: "lâu đài, thành" },

                    { voca: "せつめいしょ", tv: "sách hướng dẫn" },

                    { voca: "ず", tv: "sơ đồ, hình vẽ minh họa" },

                    { voca: "せん", tv: "đường kẻ, tuyến đường ray" },

                    { voca: "やじるし", tv: "mũi tên chỉ hướng" },

                    { voca: "くろ", tv: "màu đen" },

                    { voca: "しろ", tv: "màu trắng" },

                    { voca: "あか", tv: "màu đỏ" },

                    { voca: "あお", tv: "màu xanh nước biển" },

                    { voca: "こん", tv: "màu xanh nước biển đậm, màu xanh navy" },

                    { voca: "きいろ", tv: "màu vàng" },

                    { voca: "ちゃいろ", tv: "màu nâu" },

                    { voca: "しょうゆ", tv: "nước tương, xì dầu" },

                    { voca: "(お)きゃくさん", tv: "(vị) khách" },

                    { voca: "～か～", tv: "～ hoặc là ～" },

                    { voca: "ゆうべ", tv: "tối qua" },

                    { voca: "さっき", tv: "lúc nãy" },

                    { voca: "さどう／ちゃどう", tv: "trà đạo" },

                    { voca: "おちゃをたてます", tv: "pha trà" },

                    { voca: "さきに", tv: "(...) trước" },

                    { voca: "さきにかえります", tv: "về trước" },

                    { voca: "のせます", tv: "chất lên, để lên" },

                    { voca: "これでいいですか。", tv: "Thế này được chưa ạ?" },

                    { voca: "いかがですか。", tv: "Anh/chị thấy thế nào?" },

                    { voca: "にがい", tv: "đắng" },

                    { voca: "おやこどんぶり", tv: "tên món ăn (thịt gà và trứng để trong tô lớn)" },

                    { voca: "ざいりょう", tv: "nguyên liệu" },

                    { voca: "～ぶん", tv: "phần ～" },

                    { voca: "グラム", tv: "gram (đơn vị đo lường)" },

                    { voca: "～こ", tv: "～ cái, quả, trái (để đếm vật nhỏ)" },

                    { voca: "たまねぎ", tv: "hành tây" },

                    { voca: "よんぶんのいち", tv: "một phần tư, 1/4" },

                    { voca: "ちょうみりょう", tv: "gia vị" },

                    { voca: "てきとうなおおきさ", tv: "độ lớn thích hợp, (cắt miếng vừa ăn)" },

                    { voca: "なべ", tv: "nồi" },

                    { voca: "ひ", tv: "lửa" },

                    { voca: "ひにかけます", tv: "nhóm lửa" },

                    { voca: "にます", tv: "nấu, kho, ninh" },

                    { voca: "にえます", tv: "được nấu kỹ, rục, nhừ" },

                    { voca: "どんぶり", tv: "cái tô" },

                    { voca: "たちます", tv: "trôi qua" },

                    { voca: "じかんがたちます", tv: "thời gian trôi qua" },

                ];


            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
