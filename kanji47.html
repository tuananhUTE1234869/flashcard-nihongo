<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>KANJI47</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>1
        
        <script>
            // tạo thẻ 
            

                let lesson3 = [

                    { voca: "吹く", tv: "ふ(く) xuy" },

                    { voca: "風が吹く", tv: "かぜがふ(く) phong xuy" },

                    { voca: "燃える", tv: "も(える) nhiên" },

                    { voca: "ごみが燃える", tv: "ごみがも(える) nhiên" },

                    { voca: "亡くなる", tv: "な(くなる) vong" },

                    { voca: "集まる", tv: "あつ(まる) tập" },

                    { voca: "人が集まる", tv: "ひとがあつ(まる) nhân tập" },

                    { voca: "データを集める", tv: "データをあつ(める) tập" },

                    { voca: "別れる", tv: "わか(れる) biệt" },

                    { voca: "家族と別れる", tv: "かぞくとわか(れる) gia tộc biệt" },

                    { voca: "変な音がする", tv: "へんなおとがする biến âm" },

                    { voca: "泣き声がする", tv: "なきごえがする khấp thanh" },

                    { voca: "苦い味がする", tv: "にがいあじがする khổ vị" },

                    { voca: "良い匂いがする", tv: "いいにおいがする lương" },

                    { voca: "厳しい", tv: "きび(しい) nghiêm" },

                    { voca: "酷い", tv: "ひどい khốc" },

                    { voca: "怖い", tv: "こわ(い) bố" },

                    { voca: "実験", tv: "じっけん thực nghiệm" },

                    { voca: "人口", tv: "じんこう nhân khẩu" },

                    { voca: "匂い", tv: "におい mùi" },

                    { voca: "科学", tv: "かがく khoa học" },

                    { voca: "化学", tv: "かがく hóa học" },

                    { voca: "医学", tv: "いがく y học" },

                    { voca: "文学", tv: "ぶんがく văn học" },

                    { voca: "救急車", tv: "きゅうきゅうしゃ cứu cấp xa" },

                    { voca: "賛成", tv: "さんせい tán thành" },

                    { voca: "反対", tv: "はんたい phản đối" },

                    { voca: "大統領", tv: "だいとうりょう đại thống lĩnh" },

                    { voca: "婚約する", tv: "こんやくする hôn ước" },

                    { voca: "恋人", tv: "こいびと luyến nhân" },

                    { voca: "相手", tv: "あいて tương thủ" },

                    { voca: "知り合う", tv: "し(りあう) tri hợp" },

                    { voca: "化粧", tv: "けしょう hóa trang" },

                    { voca: "化粧品", tv: "けしょうひん hóa trang phẩm" },

                    { voca: "化粧をする", tv: "けしょうをする hóa trang" },

                    { voca: "世話をする", tv: "せわをする thế thoại" },

                    { voca: "女性", tv: "じょせい nữ tính" },

                    { voca: "男性", tv: "だんせい nam tính" },

                    { voca: "男女", tv: "だんじょ nam nữ" },

                    { voca: "長生きする", tv: "ながいきする trường sinh" },

                    { voca: "理由", tv: "りゆう lý do" },

                    { voca: "関係", tv: "かんけい quan hệ" },

                ];

                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
