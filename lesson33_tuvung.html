<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
        <style>
            .voca {
                font-size: 30px !important;
                font-weight: 600 !important;
            }
        </style>
    </head>
    <body>
        <div class="title"><h1>TUVUNG33</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>
        <script>
            // tạo thẻ 
            

            const lesson3 = [
                { voca: "にげます", tv: "chạy khỏi, chạy trốn" },
                { voca: "さわぎます", tv: "làm ồn, gây ầm ĩ" },
                { voca: "あきらめます", tv: "bỏ cuộc, từ bỏ" },
                { voca: "なげます", tv: "ném" },
                { voca: "まもります", tv: "giữ, bảo vệ, tuân thủ" },
                { voca: "はじまります", tv: "bắt đầu" },
                { voca: "しきがはじまります", tv: "buổi lễ bắt đầu" },
                { voca: "しゅっせきします", tv: "tham dự, có mặt" },
                { voca: "かいぎにしゅっせきします", tv: "dự họp" },
                { voca: "つたえます", tv: "truyền đạt, nói lại" },
                { voca: "ちゅういします", tv: "chú ý, cẩn thận, lưu ý" },
                { voca: "くるまにちゅういします", tv: "chú ý xe cộ" },
                { voca: "はずします", tv: "rời ra, rời khỏi" },
                { voca: "せきをはずします", tv: "rời chỗ ngồi" },
                { voca: "もどります", tv: "quay trở lại" },
                { voca: "あります", tv: "có" },
                { voca: "でんわがあります", tv: "có (cuộc) điện thoại" },
                { voca: "リサイクルします", tv: "tái chế" },
                { voca: "だめ（な）", tv: "không được" },
                { voca: "おなじ", tv: "giống nhau" },
                { voca: "けいさつ", tv: "đồn cảnh sát" },
                { voca: "せき", tv: "chỗ ngồi" },
                { voca: "マーク", tv: "ký hiệu" },
                { voca: "ボール", tv: "quả bóng" },
                { voca: "しめきり", tv: "hạn cuối, kỳ hạn" },
                { voca: "きそく", tv: "quy tắc, nội quy" },
                { voca: "きけん", tv: "nguy hiểm" },
                { voca: "しようきんし", tv: "cấm sử dụng" },
                { voca: "たちいりきんし", tv: "cấm vào" },
                { voca: "じょこう", tv: "chạy chậm, đi chậm" },
                { voca: "いりぐち", tv: "cửa vào, lối vào" },
                { voca: "でぐち", tv: "cửa ra, lối ra" },
                { voca: "ひじょうぐち", tv: "lối thoát hiểm" },
                { voca: "むりょう", tv: "miễn phí" },
                { voca: "ゆうりょう", tv: "có trả phí, tốn phí" },
                { voca: "わりびき", tv: "giảm giá" },
                { voca: "のみほうだい", tv: "uống thoải mái (với số tiền cố định)" },
                { voca: "しようちゅう", tv: "đang sử dụng" },
                { voca: "ぼしゅうちゅう", tv: "đang tuyển dụng" },
                { voca: "～ちゅう", tv: "đang ~" },
                { voca: "どういう～", tv: "~ như thế nào" },
                { voca: "～ても", tv: "dù... thì cũng..." },
                { voca: "もう～ない", tv: "không còn... nữa" },
                { voca: "あと～", tv: "còn (lại) ~" },
                { voca: "～ほど", tv: "khoảng ~" },
                { voca: "ちゅうしゃいはん", tv: "đỗ xe trái phép" },
                { voca: "ばっきん", tv: "tiền phạt" },
                { voca: "じしん", tv: "động đất" },
                { voca: "おきます", tv: "xảy ra" },
                { voca: "たすけあいます", tv: "giúp đỡ lẫn nhau" },
                { voca: "もともと", tv: "vốn là, nguyên là" },
                { voca: "かなしい", tv: "đau buồn, thương xót" },
                { voca: "もっと", tv: "hơn... nữa" },
                { voca: "あいさつ", tv: "việc chào hỏi" },
                { voca: "あいさつします", tv: "chào hỏi" },
                { voca: "あいて", tv: "đối phương, đối tác" },
                { voca: "きもち", tv: "tâm trạng, cảm xúc" }
            ];



            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })



            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
