<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=egde">
        <link rel="stylesheet" href="style.css">
        <title>KAIWA</title>
    </head>
    <body>
        <div class="title"><h1>KANJI33</h1></div>
        <div class="container">
            <div class="box">
                <div class="card" id="card">

                </div>
            </div>
        </div>
        <div class="box-button">
            <div class="back bt">Back</div>
            <div class="next bt">Next</div>
        </div>
        <div class="home">
            <button class="bt-home">Home</button>
            <button class="bt-reload">Reload</button>
        </div>1
        
        <script>
            // tạo thẻ 
            

           let lesson3 = [
            { voca: "逃", tv: "に(げます) đào" },
            { voca: "騒", tv: "さわ(ぎます) tao" },
            { voca: "諦", tv: "あきら(めます) đế" },
            { voca: "投", tv: "な(げます) đầu" },
            { voca: "守", tv: "まも(ります) thủ" },
            { voca: "始", tv: "はじ(まります) thủy" },
            { voca: "式", tv: "しきがはじ(まります) thức" },
            { voca: "出席", tv: "しゅっせき(します) xuất-tịch" },
            { voca: "会議", tv: "かいぎにしゅっせき(します) hội-nghị" },
            { voca: "伝", tv: "つた(えます) truyền" },
            { voca: "注意", tv: "ちゅうい(します) chú-ý" },
            { voca: "車", tv: "くるまにちゅうい(します) xa" },
            { voca: "外", tv: "はず(します) ngoại" },
            { voca: "席", tv: "せきをはず(します) tịch" },
            { voca: "戻", tv: "もど(ります) lệ" },
            { voca: "電話", tv: "でんわがあります) điện-thoại" },
            { voca: "同", tv: "おなじ đồng" },
            { voca: "警察", tv: "けいさつ cảnh-sát" },
            { voca: "席", tv: "せき tịch" },
            { voca: "締切", tv: "しめきり đế-thiết" },
            { voca: "規則", tv: "きそく quy-tắc" },
            { voca: "危険", tv: "きけん nguy-hiểm" },
            { voca: "使用禁止", tv: "しようきんし sử-dụng-cấm-chỉ" },
            { voca: "立入禁止", tv: "たちいりきんし lập-nhập-cấm-chỉ" },
            { voca: "徐行", tv: "じょこう từ-hành" },
            { voca: "入口", tv: "いりぐち nhập-khẩu" },
            { voca: "出口", tv: "でぐち xuất-khẩu" },
            { voca: "非常口", tv: "ひじょうぐち phi-thường-khẩu" },
            { voca: "無料", tv: "むりょう vô-liệu" },
            { voca: "有料", tv: "ゆうりょう hữu-liệu" },
            { voca: "割引", tv: "わりびき cát-dẫn" },
            { voca: "使用中", tv: "しようちゅう sử-dụng-trung" },
            { voca: "募集中", tv: "ぼしゅうちゅう mộ-tập-trung" },
            { voca: "駐車違反", tv: "ちゅうしゃいはん trú-xa-vi-phản" },
            { voca: "罰金", tv: "ばっきん phạt-kim" },
            { voca: "地震", tv: "じしん địa-chấn" },
            { voca: "起", tv: "お(きます) khởi" },
            { voca: "助", tv: "たす(けあいます) trợ" },
            { voca: "悲", tv: "かな(しい) bi" },
            { voca: "挨拶", tv: "あいさつ ái-sát" },
            { voca: "相手", tv: "あいて tương-thủ" },
            { voca: "気持", tv: "きもち khí-trì" }
        ];




                        
            let a = lesson3.length;
            console.log(a); // 5

            let html = "";

            for (let i = lesson3.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [lesson3[i], lesson3[j]] = [lesson3[j], lesson3[i]];
            }


            for (let i = 1; i <= a; i++) {
                html += `
                    <div class="voca${i} voca">${lesson3[i-1].voca}</div>
                    <div class="tv${i} tv">${lesson3[i-1].tv}</div>
                `;
            }
            document.getElementById("card").innerHTML = html;

            //sắp xếp lại các card item theo chiều ngang
            const vocacard = document.querySelectorAll(".voca");
            const tvcard   = document.querySelectorAll(".tv")

            tvcard.forEach((el,index)=>{
                el.style.transform = `translateX(${index * 100}%)`;
            })

            vocacard.forEach((el, index) => {
                
                el.style.transform = `translateX(${index * 100}%)`;
                
            });
            
            // lật flash card
            const voca_card = [];
            const tv_card = [];
            
            for (let i=1; i<(a+1); i++){
                voca_card[i] = document.querySelector(`.voca${i}`);
                tv_card[i] = document.querySelector(`.tv${i}`);

                voca_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "6";
                })
                tv_card[i].addEventListener("click", function(){
                    tv_card[i].style.zIndex = "4";
                })
            }

            // function tự động lật card
            function latcard(){
                for (let i=1; i<(a+1); i++){
                    tv_card[i].style.zIndex = "4"; 
                }
            }


            // next 
            let i_next = 0;
            const next = document.querySelector(".next")
            const back = document.querySelector(".back")

            back.addEventListener("click", function(){
                i_next = i_next - 1;
                if (i_next < 0){
                    i_next = (a-1);
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })
            next.addEventListener("click", function(){
                i_next = i_next + 1;
                if (i_next > (a-1)){
                    i_next = 0;
                }
                document.querySelector(".card").style.transform = `translateX(${i_next*(-100)}%)`
                latcard();
            })


            // console.log(voca_card);
            // console.log(tv_card);


            //quay về home
            const home = document.querySelector(".bt-home")

            home.addEventListener("click", function(){
                window.location.href = "index.html";
            })
            // nút reload
            document.querySelector(".bt-reload").addEventListener("click", function () {
                location.reload();
            });

        </script>
    </body>
</html>
